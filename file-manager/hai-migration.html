}

// A report of rules HAI cannot clone: why, with names, numbers and quoted text taken out, for the person to read and
// send as a GitHub issue themselves (18 October).
function anonymise(t) {
  return String(t || '').replace(/'[^']*'|"[^"]*"|“[^”]*”|‘[^’]*’/g, '"…"').replace(/https?:\/\/\S+/g, '(address)')
    .replace(/\b\d{1,3}(\.\d{1,3}){3}\b/g, '(address)').replace(/\b\d{2,}\b/g, 'N');
}
function tellText(rules) {

function showHelp() {
  var el = modal('<div class="help"><h2>How moving rules works</h2>' +
    '<div class="mini"><div class="rm">In Rule Machine</div><div class="trial">Being shadowed</div><div class="hai">Running on HAI</div></div>' +
    '<p>Each rule moves along this track, one step at a time, and only when you press.</p>' +
    '<h3>1. Clone</h3><p>HAI makes a clone that stays <b>switched off</b>. Rule Machine keeps running the rule, so nothing in your house changes. If the hub will not accept a clone as it is, it goes to the editor\'s Drafts, marked Needs fixing, with what to fix.</p>' +
    '<h3>2. Shadow</h3><p>Each time the rule is triggered, HAI works out what its clone would have done and checks that against what Rule Machine actually did. Green: at least 3 runs, all matched, every trigger seen. Amber: still watching. Red: a run differed. Grey: nothing in the rule can be checked (notifications, speech, web requests).</p>' +
    '<h3>3. Promote to HAI</h3><p>The Rule Machine rule is paused, HAI checks it really is, and only then starts the clone, with the Rule Machine rule\'s private boolean. Promote the green ones; HAI asks first when a light is not green.</p>' +
    '<h3>4. Back to Rule Machine, any time</h3><p>One click pauses the clone and starts the Rule Machine rule again. Your Rule Machine rules are never deleted.</p>' +
    '<h3>Technical</h3><p style="color:var(--muted);font-size:14px">A clone being shadowed is switched off and listens to its own triggers: devices, buttons, the mode, hub variables, HSM and the hub\'s own events, times, sun times and periodic schedules. A run by another rule or app, a Rule Machine rule\'s pause and a call to the rule\'s own address give no event HAI can hear, so those triggers are shown as can\'t be checked; a rule that reads its private boolean, which only Rule Machine holds, is checked both ways and marked partly checked. Every message between the clone, HAI Checker and this page is signed. When a trigger fires, it notes the state of the devices the rule uses, then watches the devices it would command until its own delays and waits have passed (at most 10 minutes), and HAI Checker works out, with the same simulator as the editor\'s Simulate tab, what the clone would have done. The last 20 runs of each clone are kept. Rules come from Automation Map\'s scan file in File Manager (the newest scan of either channel). Each clone is converted into an HAI rule document, checked by the same validator the editor uses, and installed as its own HAI Rule Container app, stopped. A clone the hub refuses (a device lacking a command, a missing variable) is kept as an editor draft. Switching pauses the Rule Machine rule through Rule Machine\'s own interface and confirms the pause before starting the clone; if the pause cannot be confirmed, Rule Machine stays in charge. A rule that reboots or shuts down the hub is cloned only after you say so. Cloning or deleting many rules runs as a job on the hub, a few rules per step, and this page only watches. A step in an HAI rule that acts on another rule (its private boolean, run, pause, resume, cancel) acts on that rule\'s HAI clone once it is switched over, and on the Rule Machine rule until then.</p>' +
    '<div class="acts"><button type="button" class="btn primary" id="helpClose">Got it</button></div></div>');

  el.onclick = function (e) { if (e.target === el) modal(null); };

// One listener for every button on the page, so a redraw never leaves a button without its action.

// ---- Reading the hub ------------------------------------------------------------------------------------------
function load() {
  LOADING = !FIRST;
  if (!FIRST) document.getElementById('updating').hidden = false;
  var slow = FIRST ? setTimeout(function () { if (FIRST) document.getElementById('rows').innerHTML = '<li class="empty"><span class="spin" style="display:inline-block" aria-hidden="true"></span><br>Still reading your rules. Large hubs can take up to a minute.</li>'; }, 20000) : null;
  q('/migration/api/state').then(function (out) {
    clearTimeout(slow);
    LOADING = false;
    document.getElementById('notes').innerHTML = '';
    if (!out || out.ok !== true) {
      note('<b>Your rules could not be read.</b> ' + esc((out && out.message) || 'The hub did not say why.'), true);
      document.getElementById('updating').hidden = true;
      if (FIRST) document.getElementById('rows').innerHTML = '<li class="empty">Nothing to show until your rules can be read.</li>';
      return;
    }
    var wasFirst = FIRST;
    FIRST = false;
    show(out);
    // Opened from the editor's ball: that rule's runs (0.5.130).
    if (SHADOW_OPEN) {
      var sr = ROWS.filter(function (x) { return x.haiId === SHADOW_OPEN || String(x.rmId) === SHADOW_OPEN; })[0];
      SHADOW_OPEN = null;
      if (sr) { OPEN = OPEN || {}; OPEN[look(sr).g] = true; DET[sr.rmId] = true; render(); shadowRuns(sr); }
    }
    if (PROMOTE_OPEN) {
      var pr = ROWS.filter(function (x) { return x.haiId === PROMOTE_OPEN || String(x.rmId) === PROMOTE_OPEN; })[0];
      PROMOTE_OPEN = null;
      if (pr && stage(pr) === 'trial') {
        OPEN = OPEN || {}; OPEN[look(pr).g] = true; DET[pr.rmId] = true; render();
        if (canOp(pr, 'switchOver')) confirmRun('switchOver', [pr]);
        else note('<b>' + esc(pr.rmName) + ' cannot be switched to HAI yet.</b> ' + esc(opWhy(pr, 'switchOver') || 'This clone cannot be promoted yet.'), true);
      } else if (pr && stage(pr) === 'hai') note('<b>' + esc(pr.rmName) + ' is already running on HAI.</b>');
    }
    // A run started earlier, from this page or another, is still going on the hub: watch it.
    if (wasFirst && out.job && out.job.state === 'running' && !WORKING) watchJob();
  }).catch(function (e) {
    clearTimeout(slow);
    LOADING = false;
    document.getElementById('updating').hidden = true;
    note('<b>Your rules could not be read.</b> ' + esc(e.message || 'The hub did not answer.'), true);
  });
}

function show(out) {
  ROWS = out.rows || [];
  SOURCE = out.source || null;
  DRAFTED = {};
  (out.drafted || []).forEach(function (k) { DRAFTED[String(k)] = true; });
  DRAFT_WHY = out.draftWhy || {};
  ENV = String(out.environment || '').toUpperCase();
  if (ENV !== 'DEV') SHOW_TESTS = false;
  if (out.plan) PLAN = out.plan;
  if (out.links) LINKS = out.links;
  LINKS.editor = EDITOR;
  if (out.provider) PROVIDER = out.provider;
  ASSESS = out.assess || {available: false, why: 'Needs Automation Map 2.4.36 or later.'};
  if (!PENDING && ASSESS.request) watch(ASSESS.request);
  readLine(out);
  render();
}

// One short line for what was read; the provider's own note only when it says something is wrong.
function readLine(out) {
  var p = out.provider || {};
  var age = ago(p.generatedAt);
  var v = /Automation Map (\d+\.\d+\.\d+)/.exec((out.notes || []).join(' '));
  document.getElementById('read').textContent = (age ? 'Rules read ' + age + ' ago' : 'Rules read') + (v ? ' by Automation Map ' + v[1] : '') + '.';
  var loud = {absent: 1, incompatible: 1, broken: 1, stale: 1};
  if (loud[p.state] && (out.notes || [])[0]) note(esc(cloneWords(out.notes[0])), true);
}

// ---- Scan again -----------------------------------------------------------------------------------------------
// One POST: the Migration app asks Automation Map to scan. Then this page reads the app's small answer record every
// 3 seconds, and only while a request is outstanding.
function scanMsg(t) { var b = document.getElementById('scanAgain'); b.textContent = t || 'Scan again'; b.disabled = !!t; }
function assess() {
  if (PENDING) return;
  if (!ASSESS.available) { note(esc(ASSESS.why || 'Automation Map cannot scan for HAI yet.'), true); return; }
  scanMsg('Scanning…');
  q('/migration/api/assess', {all: true}).then(function (out) {
    if (out && out.assess) { watch(out.assess); return; }
    scanMsg('');
    note('<b>The scan did not start.</b> ' + esc((out && out.message) || 'The hub did not say why.'), true);
  }).catch(function (e) { scanMsg(''); note('<b>The scan could not be sent.</b> ' + esc(e.message), true); });
}
function watch(a) { a.seenAt = Date.now(); PENDING = a; scanMsg('Scanning…'); setTimeout(poll, 3000); }
function poll() {
  if (!PENDING) return;
  q('/migration/api/assess').then(function (out) {
    var a = out && out.assess;
    if (!a || a.requestId !== PENDING.requestId) { PENDING = null; scanMsg(''); return; }
    if (a.done) {
      PENDING = null;
      scanMsg('');
      if (a.done.ok !== true) note('<b>The scan did not finish.</b> ' + esc(a.done.message || a.done.reason || 'Automation Map did not say why.'), true);
      load();
      return;
    }
    a.seenAt = PENDING.seenAt;
    PENDING = a;
    var wait = a.waitMs || 300000;
    if (Date.now() - PENDING.seenAt > wait) {
      PENDING = null;
      scanMsg('');
      note('<b>Automation Map did not answer within ' + Math.round(wait / 60000) + ' minutes.</b> Open Automation Map once, then try again.', true);
      return;
    }
    setTimeout(poll, 3000);
  }).catch(function () { setTimeout(poll, 3000); });
}

document.getElementById('scanAgain').onclick = assess;
document.getElementById('openEditor').onclick = function () { openEditor(LINKS.editor); };
document.getElementById('helpBtn').onclick = showHelp;
document.getElementById('find').oninput = function () { FIND = this.value.trim().toLowerCase(); if (!FIRST) render(); };
// Migration is optional: this just leaves the page. A tab the page did not open cannot close itself, so it goes back,
// or to the hub's apps.
document.getElementById('notNow').onclick = function () {
  try { window.close(); } catch (e) { /* not ours to close */ }
  setTimeout(function () { if (history.length > 1) history.back(); else location.href = '/installedapp/list'; }, 150);
};
stick();
load();
</script>
</body>
