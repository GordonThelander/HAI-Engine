<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Move rules to HAI</title>
<style>
/* The editor's own look (18 October: the two pages must read as one product): its colours, type, buttons, chips and
   panels. Three colours of its own carry the one idea on this page, where a rule runs: amber for Rule Machine, teal
   for a clone being shadowed in HAI, violet for running on HAI. Red is only for what needs the person. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f2f4f7; --border: #e0e4ea; --border-strong: #c9d0da;
  --text: #18202b; --muted: #566273; --faint: #8591a2;
  --accent: #0d6a88; --accent-hover: #0a5a74; --accent-weak: #e2f0f5; --accent-text: #ffffff;
  --ok: #1a7443; --ok-weak: #e3f3e9; --warn: #8f5500; --warn-weak: #fcf0da; --block: #b3261e; --block-weak: #fbeae8;
  --ai: #6d28d9; --ai-weak: #f1ebfd; --ai-text: #ffffff;
  --rm: #b45309; --rm-weak: #fdf1e3; --trial: #0d6a88; --trial-weak: #e2f0f5; --hai: #6d28d9; --hai-weak: #f1ebfd;
  --risk: #9f1239; --risk-weak: #fdecef;
  --radius: 10px; --radius-sm: 7px; --focus: #0d6a88; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --top-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1217; --surface: #151a21; --surface-2: #1b2129; --border: #28303b; --border-strong: #3a4452;
    --text: #e5e9ef; --muted: #a2acba; --faint: #788395;
    --accent: #52bfd9; --accent-hover: #74cfe4; --accent-weak: #12303a; --accent-text: #061419;
    --ok: #5cc68e; --ok-weak: #11281c; --warn: #efb457; --warn-weak: #2c2210; --block: #f08a80; --block-weak: #321614;
    --ai: #b79cf7; --ai-weak: #261d3d; --ai-text: #170b33;
    --rm: #f5a524; --rm-weak: #2c2210; --trial: #52bfd9; --trial-weak: #12303a; --hai: #b79cf7; --hai-weak: #261d3d;
    --risk: #fb7185; --risk-weak: #3a1520;
    --focus: #52bfd9; --shadow: 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--accent); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px; }

/* Buttons, as the editor's */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text); border-radius: var(--radius-sm); padding: 6px 13px; min-height: 36px; font-weight: 560; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.hai { background: var(--hai); border-color: var(--hai); color: var(--ai-text); }
.btn.hai:hover { filter: brightness(1.1); }
.btn.danger { background: var(--block); border-color: var(--block); color: #fff; }
.btn.danger:hover { filter: brightness(1.08); }
.btn.quiet-danger { color: var(--block); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 13.5px; }
.btn.big { min-height: 46px; padding: 10px 22px; font-size: 16px; font-weight: 650; }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }

/* The bar pinned to the top, as the editor's header: always there, however far down the list a person is. */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-inner { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-height: var(--top-h); padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 320px; }
.brand-mark { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-text); font-size: 15px; font-weight: 700; }
.brand h1 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
.brand .read { font-size: 12.5px; color: var(--faint); }
.top-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.help-btn { width: 36px; height: 36px; border: 0; background: transparent; color: var(--accent); cursor: pointer; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.help-btn:hover { background: var(--accent-weak); }
.safety { border-top: 1px solid var(--border); background: var(--surface-2); font-size: 13px; color: var(--muted); }
.safety .wrap { display: flex; gap: 8px; align-items: center; padding-top: 5px; padding-bottom: 5px; }
.safety svg { flex: none; color: var(--accent); }

main.wrap { padding-top: 22px; padding-bottom: 60px; }
.notes .note { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 0 0 14px; }
.notes .note.err { border-color: var(--block); background: var(--block-weak); color: var(--block); font-weight: 560; }

/* The infographic: how far the move has got. A bar in three colours for the whole hub, then three stations, each
   with its picture, its count and what it means, joined by arrows. Each station opens its panel below. */
.info { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px 20px; margin: 0 0 18px; }
.info-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.info-ttl { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.info-pct { font-size: 15px; color: var(--muted); }
.info-pct b { font-size: 26px; color: var(--hai); font-weight: 750; margin-right: 4px; }
.info .sum { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
.seg { display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
.seg > span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; min-width: 0; transition: width .6s ease; }
.seg .rm { background: var(--rm); } .seg .trial { background: var(--trial); } .seg .hai { background: linear-gradient(90deg, var(--hai), #8b5cf6); }
@media (prefers-color-scheme: dark) { .seg > span { color: #0b0f14; } }
.stations { display: grid; grid-template-columns: 1fr 34px 1fr 34px 1fr; align-items: stretch; margin-top: 16px; }
.station { position: relative; display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  background: var(--surface); cursor: pointer; color: var(--text); }
.station:hover { border-color: currentColor; }
.station .pic { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 14px; display: grid; place-items: center; }
.station .num { font-size: 28px; font-weight: 780; line-height: 1; }
.station .lbl { font-weight: 650; font-size: 14.5px; margin-top: 3px; }
.station .hint { font-size: 12.5px; color: var(--muted); }
.station.rm { border-top: 4px solid var(--rm); } .station.rm .pic { background: var(--rm-weak); color: var(--rm); } .station.rm .num { color: var(--rm); }
.station.trial { border-top: 4px solid var(--trial); } .station.trial .pic { background: var(--trial-weak); color: var(--trial); } .station.trial .num { color: var(--trial); }
.station.hai { border-top: 4px solid var(--hai); } .station.hai .pic { background: var(--hai-weak); color: var(--hai); } .station.hai .num { color: var(--hai); }
.station .flag { position: absolute; top: -11px; right: 10px; background: var(--block); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; box-shadow: var(--shadow); }
@media (prefers-color-scheme: dark) { .station .flag { color: #0b0f14; } }
.join { display: grid; place-items: center; color: var(--faint); }
@media (max-width: 760px) {
  .stations { grid-template-columns: 1fr; gap: 8px; }
  .join { transform: rotate(90deg); height: 18px; }
}

/* The drawn scene. */
.scene { display: grid; grid-template-columns: 1fr 13.6% 1fr 13.6% 1fr; align-items: start; margin-top: 14px; }
.scene svg { display: block; width: 100%; height: auto; overflow: visible; }
.scene .way { margin-top: 20%; }
/* The way back, under all three stations. */
.scene .back { grid-column: 1 / -1; margin-top: -4px; }
.scene .road-back { stroke-width: 4; }
.scene .arrowhead-back { fill: var(--rm); }
.scene .back-dots .flow { fill: var(--hai); r: 4.5; }
.scene .back-pill { fill: var(--hai-weak); stroke: color-mix(in srgb, var(--hai) 40%, transparent); stroke-width: 1.5; }
.scene .back-txt { font: 650 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
.scene .back-mini { display: none; }
@media (max-width: 640px) {
  .scene { grid-template-columns: 1fr; justify-items: center; }
  .scene .pic { max-width: 260px; }
  .scene .way { width: 80px; margin: 30px 0 34px; transform: rotate(90deg); }
  .scene svg.back { display: none; }
  .scene .back-mini { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 14px 0 0; padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface-2); font-weight: 650; font-size: 14px; text-align: left; }
  .scene .back-mini svg { flex: none; width: 30px; height: 30px; }
}
.scene .st { cursor: pointer; }
.scene .st:hover .pad, .scene .st:focus .pad { stroke-width: 2.5; }
.scene .st:focus { outline: none; }
.scene .pad { stroke-width: 1.5; }
.scene .rm-pad { fill: var(--rm-weak); stroke: color-mix(in srgb, var(--rm) 45%, transparent); }
.scene .trial-pad { fill: var(--trial-weak); stroke: color-mix(in srgb, var(--trial) 45%, transparent); }
.scene .hai-pad { fill: var(--hai-weak); stroke: color-mix(in srgb, var(--hai) 45%, transparent); }
.scene .rm-card { fill: var(--surface); stroke: var(--rm); stroke-width: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.12)); }
.scene .trial-card { fill: var(--surface); stroke: var(--trial); stroke-width: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.12)); }
.scene .rm-ink { fill: var(--rm); } .scene .trial-ink { fill: var(--trial); }
.scene .gear { fill: none; stroke: var(--rm); stroke-width: 7; stroke-dasharray: 5.4 3.5; }
.scene .gear-hub { fill: var(--rm); }
.scene .hold { fill: none; stroke: var(--trial); stroke-width: 2; stroke-dasharray: 7 5; }
.scene .pause { fill: var(--trial); } .scene .pause-bar { fill: var(--surface); }
.scene .roof { fill: none; stroke: var(--hai); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.scene .house { fill: var(--surface); stroke: var(--hai); stroke-width: 3; }
.scene .tick { fill: none; stroke: var(--ok); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.scene .spark { fill: var(--hai); opacity: .7; }
.scene .road { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 2 11; }
.scene .arrowhead { fill: var(--trial); }
.scene .s-rm { stop-color: var(--rm); } .scene .s-trial { stop-color: var(--trial); } .scene .s-hai { stop-color: var(--hai); }
.scene .rm-dots .flow { fill: var(--rm); } .scene .trial-dots .flow { fill: var(--hai); }
.scene .num { font: 800 38px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.scene .rm-txt { fill: var(--rm); } .scene .trial-txt { fill: var(--trial); } .scene .hai-txt { fill: var(--hai); }
.scene .lbl { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
.scene .hint { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); }
.scene .flag { fill: var(--block); filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.scene .flag-txt { font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #fff; }
@media (prefers-color-scheme: dark) { .scene .flag-txt { fill: #0b0f14; } }
@media (prefers-reduced-motion: reduce) { .scene animateMotion, .scene animateTransform { display: none; } }

/* The next step: one sentence and one button. */
.next { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--accent);
  border-radius: var(--radius); padding: 16px 18px; margin: 0 0 18px; box-shadow: var(--shadow); }
.next.done { border-left-color: var(--hai); }
.next .ico { font-size: 30px; line-height: 1; }
.next .txt { flex: 1 1 340px; min-width: 0; }
.next .ttl { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
.next .say { margin: 0; color: var(--muted); }
.next .also { margin: 6px 0 0; font-size: 14px; }
.next .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Search, pinned under the top bar. */
.toolbar { position: sticky; top: var(--top-sticky, 64px); z-index: 10; background: var(--bg); padding: 8px 0 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 240px; max-width: 380px; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); }
.updating { font-size: 13px; color: var(--faint); display: inline-flex; gap: 6px; align-items: center; }
.toolbar .tools { margin-left: auto; display: flex; gap: 6px; }

/* One panel per group, folded or open, its buttons in its header where they act. */
.grp { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--c); border-radius: var(--radius); box-shadow: var(--shadow); margin: 0 0 12px; }
.grp.manual { --c: var(--block); --cw: var(--block-weak); } .grp.risky { --c: var(--risk); --cw: var(--risk-weak); } .grp.ready { --c: var(--rm); --cw: var(--rm-weak); } .grp.trial { --c: var(--trial); --cw: var(--trial-weak); }
.grp.hai { --c: var(--hai); --cw: var(--hai-weak); } .grp.staying { --c: var(--faint); --cw: var(--surface-2); }
.gh { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
.gt { display: flex; align-items: center; gap: 12px; flex: 1 1 300px; min-width: 0; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--text); }
.gt .gi { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; display: grid; place-items: center; background: var(--cw); color: var(--c); }
.gt .gname { font-size: 16.5px; font-weight: 700; }
.gt .gcount { display: inline-block; min-width: 28px; text-align: center; margin-left: 8px; padding: 1px 9px; border-radius: 999px; background: var(--c); color: #fff; font-size: 13.5px; font-weight: 700; vertical-align: 2px; }
@media (prefers-color-scheme: dark) { .gt .gcount { color: #0b0f14; } }
.gt .gsay { display: block; font-size: 13.5px; color: var(--muted); }
.gt .chev { margin-left: auto; color: var(--faint); transition: transform .15s; flex: none; }
.grp.open .gt .chev { transform: rotate(90deg); }
.gacts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gbody { border-top: 1px solid var(--border); }
.gsel { display: flex; gap: 8px; align-items: center; padding: 8px 14px; font-size: 13.5px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }
.gsel label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 26px 62px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--border); }
.rows .row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .tick { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.row .nm { font-weight: 650; font-size: 15.5px; overflow-wrap: anywhere; }
.row .say { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.row.manual .say { color: var(--block); }
/* A shadowed clone's confidence light (0.5.123): green ready to promote, amber still watching, red a run differed, grey nothing to check. */
.light { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: currentColor; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px currentColor; }
/* A clone's runs (0.5.130). */
.runs { list-style: none; padding: 0; margin: 8px 0 0; max-height: 55vh; overflow-y: auto; }
.runs .run { border-top: 1px solid var(--border); padding: 8px 0; }
.runs .steps { margin: 4px 0 0 20px; padding: 0; list-style: none; color: var(--muted); }
.light.green { color: #16a34a; } .light.amber { color: #d97706; } .light.red { color: #dc2626; } .light.grey { color: #98a2b3; }
.row.lred .say { color: #b42318; }
@media (prefers-color-scheme: dark) { .row.lred .say { color: #f97066; } }
.row.picked { background: var(--accent-weak); }
.row .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.row .more { grid-column: 3 / 5; }
/* Where the rule is, on the same three-stop track as the top. */
.track { display: flex; align-items: center; width: 62px; }
.track i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface); flex: 0 0 14px; }
.track b { flex: 1 1 auto; height: 2px; background: var(--border-strong); }
.track i.rm.at { background: var(--rm); border-color: var(--rm); } .track i.trial.at { background: var(--trial); border-color: var(--trial); } .track i.hai.at { background: var(--hai); border-color: var(--hai); }
.track i.past { border-color: var(--faint); background: var(--faint); }
.row.manual .track i.at { box-shadow: 0 0 0 3px var(--block-weak), 0 0 0 4px var(--block); }
.det { margin-top: 6px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); font-size: 14px; }
.det ul { margin: 0 0 8px; padding-left: 18px; }
.det .opts label { display: block; margin: 4px 0; }
.det .links { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 6px; }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }
/* One bar for every tick on the page, pinned to the bottom of the screen. */
.selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--accent);
  box-shadow: 0 -8px 24px rgba(16,24,40,.14); }
.selbar-in { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.selcount { font-size: 15px; } .selcount b { font-size: 18px; }
.selwarn { font-size: 13.5px; font-weight: 650; color: var(--risk); }
.selacts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
body.has-sel main.wrap { padding-bottom: 120px; }
@media (max-width: 640px) {
  .selbar-in { gap: 8px; }
  .selacts { margin-left: 0; width: 100%; justify-content: flex-start; }
  .selacts .btn { flex: 1 1 auto; }
}
.modal .pbwarn { margin: 0 0 10px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--warn-weak); color: var(--warn); font-weight: 560; }
.foot { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 13.5px; color: var(--muted); }

@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .journey .hint { display: none; }
  .stop .dot { width: 52px; height: 52px; font-size: 20px; }
  .journey::before { top: 32px; }
  .stop .arrow { top: 22px; }
  .row { grid-template-columns: 22px 54px minmax(0, 1fr); }
  .row .acts { grid-column: 3 / 4; justify-content: flex-start; }
  .track { width: 54px; }
  .bulk { margin-left: 0; }
}

/* One box in the middle of the screen: asks, shows progress, then shows the result, where the person is looking. */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 32, .5); display: flex; padding: 16px; overflow: auto; }
.modal .box { margin: auto; width: min(620px, 100%); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 22px 24px; }
.modal h2 { margin: 0 0 8px; font-size: 19px; display: flex; gap: 10px; align-items: center; }
.modal p { margin: 0 0 10px; }
.modal .list { margin: 8px 0 12px; padding-left: 20px; max-height: 32vh; overflow: auto; }
.modal .list li { margin: 2px 0; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.modal.run .box { border: 2px solid var(--ai); }
.prog { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 12px 0 8px; border: 1px solid var(--border); }

<script>
var AUD = new URLSearchParams(location.search).get('aud') || '';
var TOKEN = new URLSearchParams(location.search).get('access_token') || '';
// The editor's address. Migration's API never hands it out: it carries the Engine's own credential, and this page needs
// only Migration's (2026-10-16 audit, S4). It arrives after #editor= from whoever opened this page already holding it
// (the editor's Open Migration, or HAI Migration's settings page behind the hub's login), which the browser never sends
// to the hub; failing that, from the editor tab that opened this one. Kept for this tab's reloads only.
// A rule whose shadow runs to show on opening (#shadow=<HAI rule id>, from the editor's ball, 0.5.130). Read before the
// editor's address below clears the hash.
var SHADOW_OPEN = (function () {
  var m = /(?:^#|&)shadow=([^&]*)/.exec(location.hash || '');
  try { return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; }
})();
// A rule to switch to HAI on opening (#promote=<HAI rule id>, from the editor's Switch to HAI, 0.5.143): Promote's own
// question, warnings and refusals.
var PROMOTE_OPEN = (function () {
  var m = /(?:^#|&)promote=([^&]*)/.exec(location.hash || '');
  try { return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; }
})();
var EDITOR = (function () {
  var ok = function (u) { return typeof u === 'string' && /^\/apps\/api\/\d+\/editor\?[^#\s]*$/.test(u) ? u : null; };
  var m = /(?:^#|&)editor=([^&]*)/.exec(location.hash || '');
  var url = null;
  if (m) {
    try { url = ok(decodeURIComponent(m[1])); } catch (e) { url = null; }
    try { if (url) sessionStorage.setItem('haiEditorUrl', url); } catch (e) { /* storage off: this load only */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the address keeps it */ }
  }
  if (!url) { try { url = ok(sessionStorage.getItem('haiEditorUrl')); } catch (e) { url = null; } }
  if (!url) {
    try { var o = window.opener; if (o && o.location.origin === location.origin) url = ok(o.location.pathname + o.location.search); } catch (e) { url = null; }
  }
  return url;
})();
var ROWS = [];
// Options ticked per rule before a copy (a driver's new command name, the reboot OK). Unticked means as Rule Machine did.
var UPG = {};
// Commands a driver renamed, as the hub suggested them when a copy was refused: rmId -> [{from, to, device}].
var RENAME = {};
// Rule Machine rules whose copy is a Needs fixing draft in the editor (rmId -> true), and why the hub refused it.
var DRAFTED = {};
var DRAFT_WHY = {};
var SOURCE = null;
var HAI_ISSUES = 'https://github.com/GordonThelander/HAI-Engine/issues/new';
var ASSESS = {available: false, why: ''};
var PENDING = null;

// One press at a time. The app is single-threaded: a press sent while another is still being worked on waits for the
// hub's gate, and back-to-back presses ran it out (120 s). A press made while one is outstanding is refused here, at
// once, with nothing sent. Reads (GET) still go through.
var BUSY = false;

function q(path, body) {
  if (body && BUSY) return Promise.resolve({ok: false, code: 'MIGRATION_PAGE_BUSY', message: 'The hub is still working on the last press. Try again when it answers.'});
  if (body) BUSY = true;
  var u = new URL(location.origin + location.pathname.replace(/\/migration.*$/, '') + path);
  if (TOKEN) u.searchParams.set('access_token', TOKEN);
  if (AUD) u.searchParams.set('aud', AUD);
  var opt = body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {};
  var sent = fetch(u.toString(), opt).then(function (r) { return r.json().catch(function () { return {ok: false, message: 'The hub did not answer with a result.'}; }); });
  if (!body) return sent;
  return sent.then(function (out) { BUSY = false; return out; }, function (e) { BUSY = false; throw e; });
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]; }); }

function note(text, bad) {
  var d = document.createElement('div');
  d.className = 'note' + (bad ? ' err' : '');
  d.innerHTML = text;
  document.getElementById('notes').appendChild(d);
}

// How long ago an ISO time was, in words; '' when there is no time to judge.
function ago(iso) {
  var t = Date.parse(iso || '');
  if (isNaN(t)) return '';
  var m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 60 ? m + ' minute' + (m === 1 ? '' : 's')
    : m < 2880 ? Math.round(m / 60) + ' hour' + (Math.round(m / 60) === 1 ? '' : 's')
    : Math.round(m / 1440) + ' days';
}

// ---- Conversion report ---------------------------------------------------------------------------------
// Built from the rows this page already has: the state read rebuilds every decoded rule in memory, writes
// nothing, and keeps only the verdict. No new request, so nothing more for the hub to do.
//
// Ordered for a person deciding what to move: opening on what could not be rebuilt, and repeating one
// sentence per rule, buries the answer. So it
// leads with how many rules can move today, leaves test rules out unless asked, groups what is in the way by
// what fixes it, says each repeated sentence once, and gives every rule one plain sentence and a colour.
//
// Everything from here to "report logic ends" reads only its arguments: engine/check-migration-report.js runs
// it on invented rows, the way check-editor-page.js parses the page.

// Test rules: left out of the report unless "Show test rules" is ticked, and never copied in bulk. A rule is a
// test rule when its name matches one of these, or when its rebuild says it has no actions in Rule Machine (a draft).
// One list, so a new naming habit is one line here.
var TEST_RULE_NAMES = [
  /^__/,              // probe and throwaway rules
  /^_HAI /,           // HAI's own decoder and regression rules
  /\(throwaway\)/i,
  /\(probe/i          // "(probe)" and "(probe, keep)"
];
var TEST_RULE_NO_ACTIONS = 'this rule has no actions in Rule Machine';

// How many rules one bulk Copy may name: MIG_BATCH_MAX in engine/lib/hai_migration.groovy. The app copies that
// many in one press and reports the rest as not reached, so the page offers exactly that many at a time.
var REP_BATCH_MAX = 6;

// What fixes each problem, matched on stable phrases of the reason text (a row carries the sentence, not a
// code). First match wins; a reason nothing matches needs the person. `light` is the rule's traffic light when
// this is the worst thing about it: 'wait' (amber) is HAI's side to resolve, 'you' (red) is the person's.
var REP_FIXES = [
  {key: 'fix', light: 'wait', title: 'Fix in progress, nothing for you to do',
   hint: 'A fix for these is already under way. They can move once it ships.',
   say: 'Waiting on a fix that is already under way.', act: 'Nothing to do, wait for the fix',
   // Empty while no fix is under way. Add a phrase of the reason here while one is.
   phrases: []},
  {key: 'measure', light: 'wait', title: 'Needs Rule Machine behaviour measured',
   hint: 'HAI will not guess how Rule Machine behaves here. Nothing for you to do; these can move once it is measured.',
   say: 'Waiting until HAI knows how Rule Machine handles part of it.', act: 'Nothing to do, wait for the fix',
   phrases: ['never close', 'XOR', 'stops as soon as an OR', 'not been measured', 'not measured', 'never been established']},
  {key: 'hand', light: 'you', title: 'Won\'t be copied, set up by hand',
   hint: 'HAI leaves these out on purpose. If you still want them, set them up yourself.',
   say: 'Will not be copied: set it up by hand if you still want it.', act: 'Rebuild by hand, or keep it in Rule Machine',
   phrases: ['Not copied on purpose']},
  {key: 'you', light: 'you', title: 'Needs you',
   hint: 'One change from you each, and these can move.',
   say: 'Needs a change from you before it can move.', act: 'One change each',
   phrases: []}
];
var REP_YOU = REP_FIXES[REP_FIXES.length - 1];
// The plain sentence for a 'Needs you' rule, by what is in the way. First match wins.
var REP_YOU_SAY = [
  ['not allowed to use', 'Uses a device HAI may not use yet: select it in HAI Engine\'s devices.'],
  ['disabled on this hub', 'Can be copied, but uses a disabled device: enable it before switching over.'],
  ['may not change', 'Changes a hub variable HAI rules may not change yet: it can be cloned and shadowed, but not promoted until the variable is approved.'],
  ['sets the mode', 'Sets the mode, which HAI rules may not do yet.'],
  ['Copy it anyway', 'Reboots or shuts down the hub: tick "Copy it anyway" on its row if you want it copied.'],
  ['has changed since', 'Changed in Rule Machine since it was copied: copy it again.'],
  ['could not go on the hub', 'Its copy is held, not on the hub.'],
  ['last run went wrong', 'Its HAI copy\'s last run went wrong.'],
  ['no mapping for', 'Uses something HAI cannot copy yet.']
];
var REP_LIGHTS = [['ok', 'ready'], ['wait', 'after a fix'], ['you', 'need you'], ['none', 'not read yet']];

function repTestName(n) { return TEST_RULE_NAMES.some(function (p) { return p.test(n || ''); }); }
function repIsTest(r) {
  if (repTestName(r.rmName)) return true;
  var said = [(r.rebuild || {}).message, (r.conditions || {}).message].concat(r.verdictReasons || []);
  return said.some(function (s) { return s && String(s).indexOf(TEST_RULE_NO_ACTIONS) >= 0; });
}
function repFix(text) {
  for (var i = 0; i < REP_FIXES.length; i++) {
    if (REP_FIXES[i].phrases.some(function (p) { return String(text).indexOf(p) >= 0; })) return REP_FIXES[i];
  }
  return REP_YOU;
}
function repYouSay(text) {
  for (var i = 0; i < REP_YOU_SAY.length; i++) if (String(text).indexOf(REP_YOU_SAY[i][0]) >= 0) return REP_YOU_SAY[i][1];
  return null;
}

// Everything that stands between a rule and its move, each with what fixes it. Coupling ('rules') is not here:
// it decides the order rules move in, not whether one can.
function repIssues(r) {
  var out = [];
  var add = function (text, fix, w) {
    if (text && !out.some(function (x) { return x.text === String(text); })) out.push({text: String(text), fix: fix || repFix(text), w: w || null});
  };
  if (r.conditions && r.conditions.ok === false) add(r.conditions.message || 'HAI cannot rebuild its conditions.');
  else if (r.rebuild && r.rebuild.ok === false) add(r.rebuild.message || 'HAI cannot rebuild this rule.');
  (r.warnings || []).forEach(function (w) {
    if (w.kind === 'rules') return;
    // A held copy, a changed rule, a copy whose last run went wrong: each one the person's.
    add(w.message, w.blocking ? null : REP_YOU, w);
  });
  if (!out.length && (r.verdict === 'needs-decision' || r.verdict === 'blocked')) {
    add((r.verdictReasons || [])[0] || (r.verdict === 'blocked' ? 'HAI cannot read this rule.' : 'HAI needs a decision from you about this rule.'));
  }
  return out;
}

// One rule's traffic light and plain sentence: green ready, amber only HAI's side in the way, red needs you.
function repLight(r, issues) {
  if (r.unread) return {light: 'none', say: 'Not read by Automation Map yet.'};
  if (!r.verdict || r.verdict === 'unassessed') return {light: 'none', say: 'Not assessed yet.'};
  if (r.verdict === 'empty') return {light: 'wait', say: 'Empty rule: it has no actions in Rule Machine.'};
  // A disabled device does not stop a copy, only that rule's Switch over, so it does not colour the rule: counting it
  // made the headline disagree with the rows (HAI, 17 October). Its next step still says to enable the device.
  var counted = issues.filter(function (x) { return !(x.w && x.w.kind === 'disabled'); });
  var mine = counted.filter(function (x) { return x.fix.light === 'you'; });
  if (mine.length) return {light: 'you', say: (mine[0].fix === REP_YOU && repYouSay(mine[0].text)) || mine[0].fix.say};
  if (counted.length) return {light: 'wait', say: counted[0].fix.say};
  if (r.verdict !== 'ready') return {light: 'you', say: REP_YOU.say};
  if (r.phase === 'switched') return {light: 'ok', say: 'Already moved to HAI.'};
  if (r.haiId) return {light: 'ok', say: 'Copied to HAI, not switched over yet.'};
  return {light: 'ok', say: 'Ready to copy.'};
}

// The one next step for a rule, a short verb phrase that says what needs to be done.
// `by` is the rules that reach into it, if any.
function repNames(w, fallback) {
  var n = (w && w.names) || [];
  return n.length ? n.slice(0, 2).join(' and ') + (n.length > 2 ? ' and others' : '') : fallback;
}
// The specific thing a refusal names, when it is short enough to say in the step: a quoted name, or a short reason.
function repWhat(text) {
  var q = /'([^']{1,32})'/.exec(text);
  if (q) return q[1];
  var first = repSplit(text)[0].replace(/[.!?]$/, '');
  if (first.length <= 48) return first;
  var clause = first.split(/[:;,]/)[0];
  return clause.length <= 48 ? clause.replace(/^This /, 'this ') : '';
}
function repNext(r, issues, light, by) {
  if (light === 'none') return 'Assess it';
  var kind = function (k) { return issues.filter(function (x) { return x.w && x.w.kind === k; })[0]; };
  // "then copy" only when nothing else stands in the way: a rule that also needs a second change, or waits on a
  // fix, cannot be copied after the first one, so the step says what comes next instead.
  var then = function (chosen, done) {
    var rest = issues.filter(function (x) { return x !== chosen && !(x.w && x.w.blocking === false); });
    if (!rest.length) return done;
    var more = rest.filter(function (x) { return x.fix.light === 'you'; }).length;
    return more ? 'then ' + (more === 1 ? 'one more change' : more + ' more changes') + ' (see details)' : 'then wait for the fix';
  };
  if (light === 'you') {
    var dev = kind('devices'), vars = kind('variables'), mode = kind('mode');
    if (dev) return 'Select ' + repNames(dev.w, 'its device') + ' in HAI Engine, ' + then(dev, 'then copy');
    // Since 0.5.141 a hub variable HAI may not change stops only the promotion (23 October): clone now, approve before promoting.
    if (vars && vars.w.blocking !== false) return 'Approve ' + repNames(vars.w, 'its hub variable') + ' in HAI Engine, ' + then(vars, 'then copy');
    if (vars && !r.haiId && then(vars, '')) return 'Approve ' + repNames(vars.w, 'its hub variable') + ' in HAI Engine before promoting, ' + then(vars, '');
    if (vars) return (r.haiId ? 'Approve ' : 'Clone now; approve ') + repNames(vars.w, 'its hub variable') + ' in HAI Engine before promoting';
    if (mode) return 'Allow mode changes in HAI Engine, ' + then(mode, 'then copy');
    var refusal = issues.filter(function (x) { return !x.w; })[0];
    if (refusal && refusal.fix.key === 'hand') return 'Rebuild by hand in the HAI editor, or keep it in Rule Machine';
    if (refusal && refusal.fix.light === 'you') {
      var what = repWhat(refusal.text);
      return 'Edit it in Rule Machine' + (what ? ' (' + what + ')' : '') + ', then Assess again';
    }
    if (kind('drift')) return 'Delete the copy and copy again';
    if (kind('watch')) return 'Check its last run; switch back if it repeats';
    if (kind('refused')) return 'Fix what held the copy, then switch over';
    var off = kind('disabled');
    if (off && !r.haiId && then(off, '')) return 'Enable ' + repNames(off.w, 'its device') + ' before switching over, ' + then(off, '');
    if (off) return (r.haiId ? 'Enable ' : 'Copy now; enable ') + repNames(off.w, 'its device') + ' before switching over';
    return 'Keep it in Rule Machine for now';
  }
  // A disabled device no longer colours the rule (repLight), so its step is said here too.
  var off0 = kind('disabled');
  if (light === 'wait') return off0 && !r.haiId ? 'Enable ' + repNames(off0.w, 'its device') + ' before switching over, then wait for the fix' : 'Nothing to do, wait for the fix';
  if (off0 && r.phase !== 'switched') return (r.haiId ? 'Enable ' : 'Copy now; enable ') + repNames(off0.w, 'its device') + ' before switching over';
  if (r.phase === 'switched') return 'Nothing to do, it runs on HAI';
  var options = ((r.rebuild && r.rebuild.behaviour) || []).some(function (b) { return b.differs || b.upgrade; });
  var copy = r.haiId ? '' : 'Copy';
  if (by && by.length) {
    var after = by.length <= 2 ? 'switch over after ' + by.join(' and ') + (by.length === 1 ? ' has' : ' have') + ' moved' : 'switch over last';
    return (copy ? 'Copy now, ' : '') + (copy ? after : after.charAt(0).toUpperCase() + after.slice(1));
  }
  if (options) return copy ? 'Copy, check its options, then switch over' : 'Check its options, then switch over';
  return copy ? 'Copy, then switch over' : 'Switch over';
}

function repAdd(map, key, name) { (map[key] = map[key] || []).push(name); }
// How many rules a section covers. A rule with two sentences in one section is one rule, not two.
function repRuleCount(items) {
  var seen = {};
  items.forEach(function (x) { x[1].forEach(function (n) { seen[n] = true; }); });
  return Object.keys(seen).length;
}
// [text, [rule names]], the sentence said by most rules first.
function repPairs(map) {
  return Object.keys(map).map(function (k) { return [k, map[k]]; })
    .sort(function (a, b) { return b[1].length - a[1].length || (a[0] < b[0] ? -1 : 1); });
}

function reportData(rows, showTests, ticked) {
  var tests = rows.filter(repIsTest);
  var shown = showTests ? rows : rows.filter(function (r) { return !repIsTest(r); });
  var d = {total: shown.length, tests: tests.length, showTests: !!showTests,
           lights: {ok: [], wait: [], you: [], none: []}, copied: 0, moved: 0,
           groups: {}, differs: {}, skipped: {}, reach: {}, pbOnly: {}, unread: [], ready: [], readyTicked: []};
  REP_FIXES.forEach(function (f) { d.groups[f.key] = {}; });
  shown.forEach(function (r) {
    var issues = r.unread ? [] : repIssues(r);
    var l = repLight(r, issues);
    // Which other rules reach into this one. One line per rule reached into, not one per link.
    // A caller that only sets this rule's Private Boolean (pbOnlyNames, from rmCoupling's inboundPbOnly) does not
    // hold up its move: HAI's copy keeps its own delays and Private Boolean through a restart, and switch-over
    // retargeting is being built. So that link is left out of the move order and said once under Worth knowing.
    var who = {};
    var clean = function (n) { return String(n).replace(/\s*\(Rule[- ][^)]*\)\s*$/, ''); };
    (r.warnings || []).forEach(function (w) {
      if (w.kind !== 'rules') return;
      var pb = {};
      // pbOnlyNames, not pbNames: a caller that also runs, pauses or cancels this rule keeps its move order.
      (w.pbOnlyNames || []).forEach(function (n) { pb[clean(n)] = true; });
      (w.names || []).forEach(function (n) {
        var nm = clean(n);
        if (!showTests && repTestName(nm)) return;
        if (pb[nm]) { if (!r.unread) repAdd(d.pbOnly, nm, r.rmName); } else who[nm] = true;
      });
      // A Private Boolean caller missing from names is still only a Private Boolean caller.
      Object.keys(pb).forEach(function (nm) {
        if ((showTests || !repTestName(nm)) && !(w.names || []).some(function (n) { return clean(n) === nm; }) && !r.unread) repAdd(d.pbOnly, nm, r.rmName);
      });
    });
    var by = Object.keys(who);
    if (by.length && !r.unread) d.reach[r.rmName] = by;

// ---- Flow logic ----------------------------------------------------------------------------------------
// The guided flow, four steps (17 October: the ten were confusing): Check, Choose, Copy, Switch over.
// Everything from here to "flow logic ends" reads only its arguments and the report logic above, so

  {n: 2, title: 'Choose', what: 'Tick the rules to move now, or a whole round. Anything that stops a copy shows here.'},
  {n: 3, title: 'Copy', what: 'HAI makes a stopped copy of each chosen rule. Rule Machine keeps running, so nothing changes in your house yet.'},

var FLOW_NEXT = {

  4: 'Watch the rules on HAI. If one misbehaves, switch it back. Then choose the next ones.'

// ---- The page -------------------------------------------------------------------------------------------
// Built around the person's one question, "where is each of my rules, and what do I do next?" (
// 18 October: the five-section page followed HAI's steps, with check boxes, folded groups and results off-screen).
// A rule is in one of three places, Rule Machine, being shadowed in HAI (a clone switched off) or running on HAI, shown as a
// track at the top and on every row. One Next step card says what to do now. Panels, in the agreed order (18 October,
// after testing 0.5.113), group the rules by what each needs; ticks in any panel feed one bar pinned to the bottom.
// Every change asks first in a box in the middle of the screen, and the same box shows the progress and then the
// result. ideation/2026-10-18-migration-page-redesign.md.

  manual: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.7 19 13.6 9.9c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4Z"/></svg>',
  risky: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/></svg>',
  ready: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>',
  trial: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM10 16H8V8h2v8Zm6 0h-2V8h2v8Z"/></svg>',
  hai: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h14v-8h3L12 3Zm-1.2 14-3.5-3.5 1.4-1.4 2.1 2.1 4.8-4.8 1.4 1.4-6.2 6.2Z"/></svg>',
  staying: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm5 11H7v-2h10v2Z"/></svg>'
};
var CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="m6.2 3.2-1.1 1.1L8.8 8l-3.7 3.7 1.1 1.1L11 8z"/></svg>';

function groupHtml(g, rows) {
  var key = g[0];
  var open = !!OPEN[key] || !!FIND;
  var ticks = rows.filter(tickable);
  var picked = ticks.filter(function (r) { return PICK[r.rmId]; });
  // The header buttons act on the whole panel, whatever is ticked: the ticks have the bar at the bottom.
  var acts = (PANEL_OPS[key] || []).map(function (op) {
    var m = many(op);
    var ok = rows.filter(m.ok);
    if (!ok.length) return '';
    var cls = key === 'risky' ? '' : m.cls;
    var label = key === 'risky' ? (ok.length > 1 ? 'Clone all ' + ok.length + ' anyway…' : 'Clone anyway…') : m.all(ok.length);
    return '<button type="button" class="btn small ' + cls + '" data-bulk="' + op + '" data-grp="' + key + '"' + (WORKING ? ' disabled' : '') + '>' + esc(label) + '</button>';
  }).join('');
  var h = '<section class="grp ' + key + (open ? ' open' : '') + '"><div class="gh">' +
    '<button type="button" class="gt" data-toggle="' + key + '" aria-expanded="' + open + '"><span class="gi">' + ICON[key] + '</span>' +
    '<span><span class="gname">' + g[1] + '</span><span class="gcount">' + rows.length + '</span><span class="gsay">' + esc(GSAY[key]) + '</span></span>' + CHEV + '</button>' +
    (acts ? '<div class="gacts">' + acts + '</div>' : '') + '</div>';
  if (open) {
    h += '<div class="gbody">' + (ticks.length > 1 ? '<div class="gsel"><label><input type="checkbox" data-pickall="' + key + '"' + (picked.length === ticks.length ? ' checked' : '') + '> Select all ' + ticks.length + '</label>' +
      (picked.length ? '<span>' + picked.length + ' selected here</span>' : '') + '</div>' : '') +
      '<ul class="rows">' + rows.map(rowHtml).join('') + '</ul></div>';
  }
  return h + '</section>';
}

function rowHtml(r) {
  var l = look(r);
  var tick = tickable(r) ? '<input type="checkbox" class="tick" data-pick="' + esc(r.rmId) + '"' + (PICK[r.rmId] ? ' checked' : '') + ' aria-label="Select ' + esc(r.rmName) + '">' : '<span></span>';
  var act = l.act ? '<button type="button" class="btn small ' + l.act[2] + '" data-act="' + l.act[1] + '" data-id="' + esc(r.rmId) + '"' + (WORKING ? ' disabled' : '') + '>' + esc(l.act[0]) + '</button>' : '';
  var more = '<button type="button" class="btn small ghost" data-more="' + esc(r.rmId) + '" aria-expanded="' + !!DET[r.rmId] + '">' + (DET[r.rmId] ? 'Less' : 'More') + '</button>';
  var light = l.light ? '<span class="light ' + l.light + '" role="img" aria-label="' + ({green: 'Green', amber: 'Amber', red: 'Red', grey: 'Grey'})[l.light] + ' light"></span>' : '';
  return '<li class="row ' + l.g + (l.light ? ' l' + l.light : '') + (PICK[r.rmId] ? ' picked' : '') + '">' + tick + trackHtml(l.s) +
    '<div><div class="nm">' + light + esc(r.rmName) + '</div><div class="say">' + esc(cloneWords(l.say)) + '</div></div>' +
    '<div class="acts">' + act + more + '</div>' + (DET[r.rmId] ? '<div class="more">' + detailHtml(r, l) + '</div>' : '') + '</li>';
}

// Everything that is not the next step: the full reasons, options for the clone, and the links.
function detailHtml(r, l) {
  var reasons = (r.verdictReasons || []).slice(0, 4);
  var full = (r.warnings || []).map(function (w) { return w.message; }).filter(Boolean);
  var why = [];
  [l.say].concat(full, reasons).forEach(function (x) { if (x && why.indexOf(x) < 0) why.push(x); });
  var opts = '';
  if (!hasCopy(r)) {
    (RENAME[r.rmId] || []).forEach(function (n) {
      var key = 'rename:' + n.from + '>' + n.to;
      opts += '<label><input type="checkbox" data-upg="' + esc(r.rmId) + '" data-key="' + esc(key) + '"' + ((UPG[r.rmId] || {})[key] ? ' checked' : '') + '> Use the new name: ' +
        esc(n.device) + ' now offers ' + esc(n.to) + ' instead of ' + esc(n.from) + '</label>';
    });
    ((r.rebuild && r.rebuild.behaviour) || []).filter(function (x) { return x.upgrade && x.upgrade.key !== 'hubPower'; }).forEach(function (x) {
      opts += '<label><input type="checkbox" data-upg="' + esc(r.rmId) + '" data-key="' + esc(x.upgrade.key) + '"' + ((UPG[r.rmId] || {})[x.upgrade.key] ? ' checked' : '') + '> ' + esc(x.upgrade.label) + '</label>';
    });
  }
  var links = ['<a href="/installedapp/configure/' + encodeURIComponent(r.rmId) + '" target="_blank" rel="noopener">Open in Rule Machine</a>'];
  if (hasCopy(r) && editorAt(r.haiId)) links.push('<a href="' + esc(editorAt(r.haiId)) + '" target="_blank" rel="noopener">Open the HAI clone in the editor</a>');
  if (DRAFTED[String(r.rmId)] && editorAt('rm:' + r.rmId)) links.push('<a href="' + esc(editorAt('rm:' + r.rmId)) + '" target="_blank" rel="noopener">Open the draft in the editor</a>');
  // Shadow part 2 (0.5.130): every kept run, and Test now while it is being shadowed.
  if (l.s === 'trial' && r.shadow) links.push('<button type="button" class="link" data-act="runs" data-id="' + esc(r.rmId) + '">See every run</button>');
  if (l.g === 'trial') links.push('<button type="button" class="link" data-act="test" data-id="' + esc(r.rmId) + '" title="Rule Machine runs the rule once, for real, and HAI checks it">Run for real and check</button>');
  if (hasCopy(r) && !isLive(r) && canOp(r, 'deleteClone') && !(l.act && l.act[1] === 'delete')) links.push('<button type="button" class="link" data-act="delete" data-id="' + esc(r.rmId) + '">Delete the HAI clone</button>');
  if (r.repairNote) why.push(r.repairNote);
  return '<div class="det">' + (why.length > 1 ? '<ul>' + why.slice(1).map(function (x) { return '<li>' + esc(cloneWords(x)) + '</li>'; }).join('') + '</ul>' : '') +
    (opts ? '<div class="opts"><b>Options for the clone</b>' + opts + '</div>' : '') + '<div class="links">' + links.join('') + '</div></div>';
}

function render() {
  var rows = visible();
  var c = counts(rows);
  // First draw: open the panel the next step points at; the rest folded.
  if (!OPEN) { OPEN = {}; OPEN[c.ready ? 'ready' : c.trial ? 'trial' : c.manual ? 'manual' : c.risky ? 'risky' : c.hai ? 'hai' : 'staying'] = true; }
  renderJourney(c);
  renderNext(c);
  document.getElementById('updating').hidden = !LOADING;
  var keep = {};
  var html = GROUPS.map(function (g) {
    var rs = groupRows(rows, g[0]);
    rs.forEach(function (r) { keep[r.rmId] = true; });
    return rs.length ? groupHtml(g, rs) : '';
  }).join('');
  Object.keys(PICK).forEach(function (k) { if (!keep[k]) delete PICK[k]; });
  document.getElementById('groups').innerHTML = html || '<div class="grp staying"><div class="empty"><span class="big" aria-hidden="true">' + (FIND ? '🔍' : '✓') + '</span>' +
    (FIND ? 'No rule matches “' + esc(FIND) + '”.' : 'No Rule Machine rules to show.') + '</div></div>';
  var nTest = ENV === 'DEV' ? ROWS.filter(isTestRule).length : 0;
  document.getElementById('foot').innerHTML = '<span>' + (SOURCE && SOURCE.detail && SOURCE.detail.appVersion ? 'Read by Automation Map ' + esc(SOURCE.detail.appVersion) + '.' : '') + '</span>' +
    (nTest ? '<label><input type="checkbox" id="showTests"' + (SHOW_TESTS ? ' checked' : '') + '> Show HAI\'s own test rules (' + nTest + ')</label>' : '');
  renderBar(rows);
  stick();
}

// The one bar for every tick on the page, pinned to the bottom of the screen: how many are ticked, and each thing
// that can be done to them with its count ("3 selected · Clone 3"). Ticks of different kinds offer each action that
// fits (18 October).
function picked(rows) { return rows.filter(function (r) { return PICK[r.rmId]; }); }
function renderBar(rows) {
  var el = document.getElementById('selbar');
  var sel = picked(rows);
  document.body.classList.toggle('has-sel', sel.length > 0);
  if (!sel.length) { el.hidden = true; el.innerHTML = ''; return; }
  var btns = MANY.map(function (m) {
    var n = sel.filter(m.ok).length;
    return n ? '<button type="button" class="btn ' + m.cls + '" data-bar="' + m.op + '"' + (WORKING ? ' disabled' : '') + '>' + esc(m.bar(n)) + '</button>' : '';
  }).join('');
  var risky = sel.filter(function (r) { return look(r).kind === 'power'; }).length;
  el.hidden = false;
  el.innerHTML = '<div class="wrap selbar-in"><span class="selcount"><b>' + sel.length + '</b> selected</span>' +
    (risky ? '<span class="selwarn">⚠️ ' + plural(risky, 'risky rule', 'risky rules') + '</span>' : '') +
    '<span class="selacts">' + btns + '<button type="button" class="btn ghost" id="selClear">Clear</button></span></div>';
}

// Opens a panel and brings it into view, from the picture, the next step or a result.
function goTo(g) {
  OPEN = OPEN || {};
  // A search that hides the panel asked for is cleared, or the link would do nothing (18 October).
  var want = g === 'rm' ? 'ready' : g;
  if (FIND && !groupRows(visible(), want).length && !(g === 'rm' && groupRows(visible(), 'manual').length)) {
    FIND = '';
    document.getElementById('find').value = '';
  }
  OPEN[want] = true;
  if (g === 'rm') OPEN.manual = true;
  render();
  var el = document.querySelector('.grp.' + (g === 'rm' ? (document.querySelector('.grp.ready') ? 'ready' : 'manual') : g));
  if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - document.getElementById('top').offsetHeight - 70, behavior: 'smooth'});
}

// The list's bar sits under the pinned top bar, whatever height the top bar has wrapped to.
function stick() { document.documentElement.style.setProperty('--top-sticky', document.getElementById('top').offsetHeight + 'px'); }
window.addEventListener('resize', stick);

// ---- Asking, progress and results: one box in the middle of the screen ------------------------------------
function modal(html, cls) {
  var m = document.getElementById('modal');
  if (!html) { m.innerHTML = ''; return null; }
  m.innerHTML = '<div class="modal' + (cls ? ' ' + cls : '') + '" role="dialog" aria-modal="true"><div class="box">' + html + '</div></div>';
  return m.firstChild;
}
function namesList(rules) {
  var top = rules.slice(0, 12).map(function (r) { return '<li>' + esc(r.rmName || r.rmId) + '</li>'; });
  if (rules.length > 12) top.push('<li>and ' + (rules.length - 12) + ' more</li>');
  return '<ul class="list">' + top.join('') + '</ul>';
}
// Asks, and answers through `yes` only when the person agrees. Escape and the backdrop say no.
function ask(o, yes) {
  var el = modal('<h2>' + (o.danger ? '⚠️ ' : '') + esc(o.title) + '</h2><p>' + o.text + '</p>' + (o.after || '') + (o.rules ? namesList(o.rules) : '') +
    '<div class="acts"><button type="button" class="btn" id="mNo">' + esc(o.no || 'Cancel') + '</button><button type="button" class="btn ' + (o.danger ? 'danger' : o.cls || 'primary') + '" id="mYes">' + esc(o.yes) + '</button></div>');
  var close = function () { modal(null); document.removeEventListener('keydown', key); };
  var key = function (e) { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  el.onclick = function (e) { if (e.target === el) close(); };
  document.getElementById('mNo').onclick = close;
  document.getElementById('mYes').onclick = function () { close(); yes(); };
  document.getElementById('mYes').focus();
}

var DOING = {clone: 'Cloning', deleteClone: 'Deleting the HAI clones of', switchOver: 'Promoting to HAI', switchBack: 'Moving back to Rule Machine'};
var EACH = {clone: 7, deleteClone: 8, switchOver: 6, switchBack: 6};
// Progress: how far, the rule being worked on, and time left from the start (the usual pace until this run has its own).
function progress(op, total, handled, startedAt, nowAt, current) {
  var spent = Math.max(0, ((nowAt || Date.now()) - startedAt) / 1000);
  var each = handled ? spent / handled : EACH[op] || 7;
  var left = Math.max(0, Math.round((total - handled) * each - (handled ? 0 : spent)));
  var pct = total ? Math.round(100 * handled / total) : 0;
  var when = left < 60 ? 'about ' + Math.max(5, Math.round(left / 5) * 5) + ' seconds left' : 'about ' + plural(Math.round(left / 60), 'minute', 'minutes') + ' left';
  var el = document.getElementById('runBox');
  if (!el) {
    modal('<div id="runBox"><h2><span class="spin" aria-hidden="true"></span><span id="runTtl"></span></h2><div class="prog" id="runBar"><div></div></div>' +
      '<p class="runnow" id="runNow"></p><div class="runmeta"><span id="runCount"></span><span id="runLeft"></span></div>' +
      '<p class="say" style="color:var(--muted);margin-top:10px">' + (op === 'clone' || op === 'deleteClone' ? 'This runs on the hub: you can close this page and come back.' : 'Please keep this page open until it finishes.') + '</p>' +
      '<div class="acts"><button type="button" class="btn" id="runStop"' + (op === 'clone' || op === 'deleteClone' ? '' : ' hidden') + '>Stop after this rule</button></div></div>', 'run');
    document.getElementById('runStop').onclick = function () { this.disabled = true; this.textContent = 'Stopping after this rule…'; q('/migration/api/job/stop', {}); };
  }
  document.getElementById('runTtl').textContent = (DOING[op] || 'Working on') + ' ' + plural(total, 'rule', 'rules');
  var barEl = document.getElementById('runBar');
  barEl.className = 'prog' + (handled ? '' : ' busy');
  barEl.firstChild.style.width = pct + '%';
  document.getElementById('runNow').textContent = current ? 'Now: ' + current : '';
  document.getElementById('runCount').textContent = handled + ' of ' + total + ' done · ' + pct + '%';
  document.getElementById('runLeft').textContent = handled < total ? when : 'finishing';
}

var WORDS = {
  clone: ['Cloned to HAI, switched off', 'HAI is shadowing the clones. Rule Machine keeps running the rules until you promote them.'],
  deleteClone: ['HAI clones deleted', 'The Rule Machine rules are unchanged and still running.'],
  switchOver: ['Promoted to HAI', 'The Rule Machine rules are paused and the HAI clones are running.'],
  switchBack: ['Back on Rule Machine', 'The HAI clones are paused and the Rule Machine rules are running again.']
};
// The result, in the same box: what was done, drafts to fix, and what was not done grouped by reason, every rule
// named, then the next step.
function showResult(op, done, flagged, failed, stopped) {
  var w = WORDS[op];
  var groups = {}, order = [];
  failed.forEach(function (f) {
    var why = cloneWords(String(f.why || 'The hub did not say why').replace(/[.!?]+$/, ''));
    if (!groups[why]) { groups[why] = []; order.push(why); }
    groups[why].push(f);
  });
  var li = function (x, link) { return '<li>' + esc(x.name) + (link ? ' · <a href="' + esc(link) + '" target="_blank" rel="noopener">' + (op === 'clone' && link.indexOf('rm%3A') >= 0 ? 'Fix in the editor' : 'Open') + '</a>' : '') + '</li>'; };
  var word = {clone: 'cloned', deleteClone: 'deleted', switchOver: 'promoted to HAI', switchBack: 'back on Rule Machine'}[op];
  var bits = [];
  if (done.length) bits.push(done.length + ' ' + word);
  if (flagged.length) bits.push(plural(flagged.length, 'draft', 'drafts') + ' to fix');
  if (failed.length) bits.push(failed.length + (op === 'clone' ? ' not cloned' : ' not done'));
  var head = (failed.length || flagged.length ? (done.length ? '✅ ' : '⚠️ ') : '✅ ') + (bits.join(' · ') || 'Nothing was done');
  var h = '<h2>' + head + (stopped ? ' (stopped)' : '') + '</h2>';
  if (done.length) h += '<div class="res ok"><h3>' + esc(w[0]) + ': ' + done.length + '</h3><div class="why">' + esc(w[1]) + '</div><ul>' + done.map(function (x) { return li(x); }).join('') + '</ul></div>';
  if (flagged.length) h += '<div class="res fix"><h3>🛠 Drafts to fix: ' + flagged.length + '</h3><div class="why">The hub would not accept these clones as they are. Each is in the editor\'s Drafts with what to fix.</div><ul>' +
    flagged.map(function (x) { return li(x, editorAt('rm:' + x.id)); }).join('') + '</ul></div>';
  order.forEach(function (why) {
    h += '<div class="res no"><h3>' + (op === 'clone' ? 'Not cloned' : 'Not done') + ': ' + groups[why].length + '</h3><div class="why">' + esc(why) + '</div><ul>' + groups[why].map(function (x) { return li(x); }).join('') + '</ul></div>';
  });
  // A rule not cloned, for a reason a retry would repeat, waits under Requires some manual intervention with its reason.
  var next = op === 'clone' && (flagged.length || failed.length) ? ['Show what needs me', 'manual'] : op === 'clone' && done.length ? ['Show the clones', 'trial']
    : op === 'switchOver' && done.length ? ['Show rules on HAI', 'hai'] : null;
  modal(h + '<div class="acts"><button type="button" class="btn" id="resClose">Close</button>' +
    (next ? '<button type="button" class="btn primary" id="resNext">' + next[0] + '</button>' : '') + '</div>', 'run');
  document.getElementById('resClose').onclick = function () { modal(null); };
  if (next) document.getElementById('resNext').onclick = function () { modal(null); PICK = {}; goTo(next[1]); };
}

// What a finished run changed, put on the rows at once, so the list does not lag behind the box. The reload follows.
function settle(op, ids, refused) {
  // A clone the converter refused for the rule as it is (an RM_ code, kept by the hub too) waits under Requires some
  // manual intervention with its reason at once, not back under Available to clone until the reload lands.
  (refused || []).forEach(function (x) {
    var r = rowOf(x.id);
    if (r && x.code && String(x.code).indexOf('RM_') === 0 && !warn(r, 'notCloned')) r.warnings = (r.warnings || []).concat([{kind: 'notCloned', names: [], blocking: false, message: x.why || x.message || ''}]);
  });
  ROWS.forEach(function (r) {
    if (ids.indexOf(r.rmId) < 0) return;
    if (op === 'deleteClone') { r.haiId = null; r.phase = 'none'; }
    if (op === 'switchOver') r.phase = 'switched';
    if (op === 'switchBack') { r.phase = 'reverted'; r.live = 'rm'; }
  });
}

// ---- Running ----------------------------------------------------------------------------------------------
// Clone and delete of several rules run on the hub as a job (18 October): the page asks once and then watches, so a
// sleeping phone, a closed tab or a lost answer cannot break the run or its count.
function runJob(op, rules) {
  WORKING = true;
  var ups = {};
  if (op === 'clone') rules.forEach(function (r) { var u = upgList(r); if (u.length) ups[r.rmId] = u; });
  progress(op, rules.length, 0, Date.now(), Date.now(), null);
  render();
  q('/migration/api/run', {op: op, rmIds: rules.map(function (r) { return r.rmId; }), upgrades: ups}).then(function (out) {
    if (!out || out.ok !== true) {
      if (out && out.code === 'MIGRATION_JOB_RUNNING') { watchJob(); return; }
      WORKING = false;
      showResult(op, [], [], [{name: 'The run', why: (out && out.message) || 'The hub did not start the run'}]);
      render();
      return;
    }
    watchJob();
  }, function () { watchJob(); });
}

function watchJob() {
  WORKING = true;
  var names = {};
  ROWS.forEach(function (r) { names[r.rmId] = r.rmName; });
  var tick = function () {
    q('/migration/api/job').then(function (out) {
      var v = out && out.job;
      if (!v) { WORKING = false; modal(null); load(); return; }
      if (v.state === 'running') {
        progress(v.op, v.total || 0, v.handled || 0, v.startedAt || Date.now(), v.now, names[(v.ids || [])[v.handled || 0]] || null);
        setTimeout(tick, 2500);
        return;
      }
      var done = [], flagged = [], failed = [], doneIds = [];
      (v.results || []).forEach(function (x) {
        var item = {id: x.rmId, name: x.rmName || names[x.rmId] || x.rmId, why: first(x.message || ''), code: x.code, message: x.message};
        if (x.ok) { done.push(item); doneIds.push(x.rmId); }
        else if (x.flagged) flagged.push(item);
        else failed.push(item);
        if (x.renames && x.renames.length) { RENAME[x.rmId] = x.renames; DET[x.rmId] = true; }
      });
      if (v.state === 'stopped') (v.ids || []).slice(v.handled || 0).forEach(function (k) { failed.push({id: k, name: names[k] || k, why: 'Not reached: the run was stopped'}); });
      WORKING = false;
      settle(v.op, doneIds, v.op === 'clone' ? failed : null);
      PICK = {};
      showResult(v.op, done, flagged, failed, v.state === 'stopped');
      render();
      load();
    }, function () { setTimeout(tick, 5000); });
  };
  tick();
}

// One rule, or a switch of several: through the apply route, a few at a time (the app is single-threaded), with the
// same box. A lost answer is asked about at the end rather than counted as a failure (18 October: 54 lost answers
// were counted as failed while the hub had made the copies).
function runAll(op, rules) {
  if (!rules.length || WORKING) return;
  rules = rules.slice().sort(byPlan);
  if ((op === 'clone' || op === 'deleteClone') && rules.length > 1) { runJob(op, rules); return; }
  var queue = [];
  var plain = [];
  rules.forEach(function (r) {
    var up = op === 'clone' ? upgList(r) : [];
    if (up.length) queue.push({rmId: r.rmId, op: op, upgrades: up}); else plain.push(r.rmId);
  });
  for (var i = 0; i < plain.length; i += REP_BATCH_MAX) {
    var ids = plain.slice(i, i + REP_BATCH_MAX);
    queue.push(ids.length === 1 ? {rmId: ids[0], op: op} : {op: op, rmIds: ids});
  }
  var names = {};
  rules.forEach(function (r) { names[r.rmId] = r.rmName; });
  var had = {};
  rules.forEach(function (r) { had[r.rmId] = hasCopy(r); });
  var done = [], flagged = [], failed = [], lost = [];
  var item = function (k, why, code, message) { return {id: k, name: names[k] || k, why: why, code: code, message: message}; };
  var refused = function (k, message, code) {
    if (message === 'The hub did not answer with a result.') { lost.push(k); return; }
    if (op === 'clone' && !had[k] && /already an HAI copy/i.test(String(message || ''))) { done.push(item(k)); return; }
    failed.push(item(k, first(message || 'The hub did not say why.'), code, message));
  };
  var started = Date.now();
  WORKING = true;
  render();
  var next = function () {
    var handled = done.length + flagged.length + failed.length;
    progress(op, rules.length, handled, started, Date.now(), queue.length ? names[queue[0].rmId || queue[0].rmIds[0]] : null);
    if (!queue.length && lost.length) {
      var askAbout = lost; lost = [];
      q('/migration/api/state').then(function (st) {
        var byId = {};
        ((st && st.rows) || []).forEach(function (r) { byId[r.rmId] = r; });
        askAbout.forEach(function (k) {
          var r = byId[k];
          var ok = r && (op === 'clone' ? hasCopy(r) : op === 'deleteClone' ? !hasCopy(r) : op === 'switchOver' ? r.phase === 'switched' : r.phase !== 'switched');
          if (ok) done.push(item(k)); else failed.push(item(k, 'The hub did not answer. Reload the page to see where this rule is'));
        });
        next();
      }).catch(function () { askAbout.forEach(function (k) { failed.push(item(k, 'The hub did not answer. Reload the page to see where this rule is')); }); next(); });
      return;
    }
    if (!queue.length) {
      WORKING = false;
      settle(op, done.map(function (x) { return x.id; }), op === 'clone' ? failed : null);
      PICK = {};
      showResult(op, done, flagged, failed, false);
      render();
      load();
      return;
    }
    var body = queue.shift();
    q('/migration/api/apply', body).then(function (out) {
      if (out && out.done instanceof Array) {
        out.done.forEach(function (d) { done.push(item(d.rmId)); });
        (out.failed || []).forEach(function (f) { if (f.renames && f.renames.length) { RENAME[f.rmId] = f.renames; DET[f.rmId] = true; } });
        (out.failed || []).concat(out.notAttempted || []).forEach(function (f) {
          if (f.flagged) flagged.push(item(f.rmId)); else refused(f.rmId, f.message || 'no reason given', f.code);
        });
      } else if (out && out.ok === true) {
        done.push(item(body.rmId));
      } else {
        if (out && out.renames && out.renames.length && body.rmId) { RENAME[body.rmId] = out.renames; DET[body.rmId] = true; }
        if (out && out.flagged) flagged.push(item(body.rmId));
        else (body.rmIds || [body.rmId]).forEach(function (k) { refused(k, out && out.message, out && out.code); });
      }
      next();
    }).catch(function () { (body.rmIds || [body.rmId]).forEach(function (k) { lost.push(k); }); next(); });
  };
  next();
}

// ---- What each press does ------------------------------------------------------------------------------------
function rowOf(id) { return ROWS.filter(function (r) { return r.rmId === id; })[0]; }
function openEditor(url) {
  if (!url) { note('Open the editor from the HAI Engine page, then open this page from the editor\'s Open Migration.', true); return; }
  // A tab in the same browser, reused on the next press (18 October: a size made it a separate browser window).
  var w = window.open(url, 'haiEditor');
  if (w) { try { w.focus(); } catch (e) { /* another window's */ } }
}
// Rules still in Rule Machine that set the private boolean of a rule being switched over. Once switched, a caller on
// HAI sets the HAI clone, but one left in Rule Machine goes on setting the paused Rule Machine rule (18 October:
// "switch that one too"). From the callers each row already names (its 'rules' warnings): nothing more is read.
function pbCallersLeft(rules) {
  var clean = function (n) { return String(n || '').replace(/\s*\(Rule[- ][^)]*\)\s*$/, '').trim(); };
  var byNm = {};
  ROWS.forEach(function (x) { byNm[clean(x.rmName)] = x; });
  var going = {};
  rules.forEach(function (r) { going[r.rmId] = true; });
  var out = [];
  rules.forEach(function (r) {
    var set = [];
    (r.warnings || []).forEach(function (w) {
      if (w.kind !== 'rules') return;
      (w.pbNames || []).forEach(function (n) {
        var c = byNm[clean(n)];
        if (c && !going[c.rmId] && stage(c) !== 'hai' && set.indexOf(clean(c.rmName)) < 0) set.push(clean(c.rmName));
      });
    });
    if (set.length) out.push({rule: clean(r.rmName), by: set});
  });
  return out;
}
function pbWarnHtml(list) {
  if (!list.length) return '';
  var names = function (a) { return a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; };
  return list.slice(0, 6).map(function (x) {
    return '<p class="pbwarn">⚠️ ' + esc(x.rule) + '\'s private boolean is set by ' + esc(names(x.by)) + ', which ' + (x.by.length === 1 ? 'is' : 'are') +
      ' still in Rule Machine. Switch ' + (x.by.length === 1 ? 'that one' : 'those') + ' too.</p>';
  }).join('') + (list.length > 6 ? '<p class="pbwarn">And ' + plural(list.length - 6, 'more rule', 'more rules') + ' like these.</p>' : '');
}
function confirmRun(op, rules) {
  if (!rules.length || WORKING) return;
  var n = rules.length;
  var one = n === 1 ? '“' + esc(rules[0].rmName) + '”' : plural(n, 'rule', 'rules');
  if (op === 'clone') return ask({title: 'Clone ' + (n === 1 ? 'this rule' : n + ' rules') + ' into HAI?', yes: n === 1 ? 'Clone' : 'Clone ' + n,
    text: 'HAI makes a paused clone of ' + one + '. Rule Machine keeps running ' + (n === 1 ? 'it' : 'them') + ', so nothing in your house changes.' + (n > 1 ? ' About ' + plural(Math.max(1, Math.round(n * 7 / 60)), 'minute', 'minutes') + '.' : ''),
    rules: n > 1 ? rules : null}, function () { runAll(op, rules); });
  if (op === 'switchOver') {
    // Promote asks first, and says plainly when the light is not green: what differed on red, and that it has not been
    // checked enough on amber or grey (20 October).
    var red = rules.filter(function (r) { return shadowOf(r).l === 'red'; });
    var unsure = rules.filter(function (r) { var l = shadowOf(r).l; return l === 'amber' || l === 'grey'; });
    var warn = '';
    if (red.length) {
      warn += '<p class="pbwarn">⚠️ ' + (red.length === 1 ? '“' + esc(red[0].rmName) + '” did not do what Rule Machine did: ' + esc(shadowOf(red[0]).w || 'a run differed') + '.'
        : plural(red.length, 'clone', 'clones') + ' did not do what Rule Machine did:') + ' Promoted, ' + (red.length === 1 ? 'it' : 'they') + ' would act the same way.</p>';
      if (red.length > 1) warn += '<ul class="list">' + red.slice(0, 6).map(function (r) { return '<li>' + esc(r.rmName) + ': ' + esc(shadowOf(r).w || 'a run differed') + '</li>'; }).join('') + '</ul>';
    }
    if (unsure.length) {
      warn += '<p class="pbwarn">⚠️ ' + (unsure.length === 1 ? '“' + esc(unsure[0].rmName) + '” has' : plural(unsure.length, 'clone has', 'clones have')) +
        ' not been checked against Rule Machine enough to be sure ' + (unsure.length === 1 ? 'it does' : 'they do') + ' the same. ' + (unsure.length === 1 ? 'It' : 'They') + ' may act differently.</p>';
    }
    return ask({title: red.length ? (n === 1 ? 'Promote a clone that differed?' : 'Promote ' + n + ' rules, ' + red.length + ' that differed?')
                 : unsure.length ? (n === 1 ? 'Promote before its light is green?' : 'Promote ' + n + ' rules before every light is green?')
                 : 'Promote ' + (n === 1 ? 'this rule' : n + ' rules') + ' to HAI?',
      yes: n === 1 ? 'Promote to HAI' : 'Promote ' + n, cls: 'hai', danger: red.length > 0,
      text: 'Rule Machine pauses ' + one + ' and the HAI ' + (n === 1 ? 'clone starts' : 'clones start') + '. HAI checks the pause before it starts anything, and ' + (n === 1 ? 'the clone takes the' : 'each clone takes its') + ' Rule Machine rule\'s private boolean. Back to Rule Machine is one click, any time.',
      after: warn + pbWarnHtml(pbCallersLeft(rules)), rules: n > 1 ? rules : null}, function () { runAll(op, rules); });
  }
  if (op === 'switchBack') return ask({title: 'Back to Rule Machine?', yes: n === 1 ? 'Back to Rule Machine' : 'Move ' + n + ' back', cls: 'primary',
    text: 'The HAI ' + (n === 1 ? 'clone of ' + one + ' pauses' : 'clones of ' + one + ' pause') + ' and Rule Machine runs ' + (n === 1 ? 'it' : 'them') + ' again. The clones are kept, so you can switch again later.',
    rules: n > 1 ? rules : null}, function () { runAll(op, rules); });
  if (op === 'deleteClone') return ask({title: 'Delete ' + (n === 1 ? 'the HAI clone?' : n + ' HAI clones?'), yes: n === 1 ? 'Delete the clone' : 'Delete ' + n + ' clones', danger: true,
    text: 'The HAI ' + (n === 1 ? 'clone of ' + one + ' is' : 'clones are') + ' deleted, with any draft made for ' + (n === 1 ? 'it' : 'them') + '. This cannot be undone. Your Rule Machine rules are not changed and keep running.',
    rules: n > 1 ? rules : null}, function () { runAll(op, rules); });
}
// A clone of rules that include ones rebooting or shutting down the hub: one warning naming those, then all of them.
function cloneWithRisky(rules) {
  var risky = rules.filter(function (r) { return look(r).kind === 'power'; });
  if (!risky.length) return confirmRun('clone', rules);
  var n = rules.length;
  ask({title: n === risky.length ? 'Clone ' + plural(n, 'rule', 'rules') + ' that restart the hub?' : 'Clone ' + n + ' rules, ' + risky.length + ' of them risky?', danger: true,
    yes: n === 1 ? 'Clone it anyway' : 'Clone ' + n + ' anyway',
    text: (risky.length === 1 ? '“' + esc(risky[0].rmName) + '” ' + hubPowerWord(risky[0]) + ' the hub, and its HAI clone will too' : 'These rules reboot or shut down the hub, and their HAI clones will too') +
      ' once you switch ' + (risky.length === 1 ? 'it' : 'them') + ' over. The clones are made paused, so nothing happens until then. Clone ' + (risky.length === 1 ? 'it' : 'them') + ' only if you mean to.',
    rules: risky.length > 1 ? risky : null},
    function () { risky.forEach(function (r) { UPG[r.rmId] = UPG[r.rmId] || {}; UPG[r.rmId].hubPower = true; }); runAll('clone', rules); });
}

function act(kind, id) {
  var r = rowOf(id);
  if (!r) return;
  if (kind === 'clone') return confirmRun('clone', [r]);
  if (kind === 'switch') return confirmRun('switchOver', [r]);
  if (kind === 'back') return confirmRun('switchBack', [r]);
  if (kind === 'delete') return confirmRun('deleteClone', [r]);
  if (kind === 'fix') return openEditor(editorAt('rm:' + r.rmId));
  if (kind === 'engine') return window.open(LINKS.engine, '_blank', 'noopener');
  if (kind === 'devices') return window.open(LINKS.devices, '_blank', 'noopener');
  if (kind === 'scan') return assess();
  if (kind === 'tell') return tellHai([r]);
  if (kind === 'anyway') return cloneWithRisky([r]);
  if (kind === 'runs') return shadowRuns(r);
  if (kind === 'test') return shadowTest(r);
}

// ---- Shadow part 2 (0.5.130): a clone's runs, and Test now ----------------------------------------------------
var VERDICT = {m: ['Matched', 'green'], d: ['Did not match', 'red'], c: ['Could not be checked', 'grey']};
var STEP = {matched: '✓', differs: '✗', cant: '–', later: '…'};
function runHtml(run) {
  var v = VERDICT[run.v] || VERDICT.c;
  var when = run.at ? new Date(Number(run.at)).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
  var steps = (run.st || []).map(function (s) { return '<li><span aria-hidden="true">' + (STEP[s.s] || '·') + '</span> ' + esc(s.say) + '</li>'; }).join('');
  return '<li class="run"><div><span class="light ' + v[1] + '"></span><b>' + v[0] + '</b>' + (run.p ? ' (partly checked)' : '') +
    ' · ' + esc(when) + (run.x ? ' · run for real and checked' : '') + '</div>' +
    (steps ? '<ul class="steps">' + steps + '</ul>' : (run.v === 'd' && run.w ? '<p>' + esc(run.w) + '</p>' : '')) + '</li>';
}
function shadowRuns(r) {
  var close = function () { modal(null); };
  modal('<h2>' + esc(r.rmName || r.rmId) + '</h2><p><span class="spin" aria-hidden="true"></span> Reading the clone’s runs…</p>');
  q('/migration/api/shadow', {rmId: r.rmId, op: 'runs'}).then(function (out) {
    var runs = (out && out.runs) || [];
    var head = '<h2>' + esc(r.rmName || r.rmId) + '</h2><p>' + esc(shadowOf(r).say) + '</p>';
    var body = !out || out.ok === false ? '<p>' + esc((out && out.message) || 'The clone did not answer.') + '</p>'
      : runs.length ? '<p class="say" style="color:var(--muted)">Newest first. Each run is what HAI worked out it would have done, against what Rule Machine did. Steps are kept for the last five runs and any that did not match.</p><ul class="runs">' + runs.slice().reverse().map(runHtml).join('') + '</ul>'
      : '<p>No runs yet. Each time Rule Machine runs this rule, HAI checks it here.</p>';
    var el = modal(head + body + '<div class="acts"><button type="button" class="btn" id="mClose">Close</button>' +
      (look(r).g === 'trial' ? '<button type="button" class="btn primary" id="mTest">Run for real and check</button>' : '') + '</div>');
    el.onclick = function (e) { if (e.target === el) close(); };
    document.getElementById('mClose').onclick = close;
    var t = document.getElementById('mTest');
    if (t) t.onclick = function () { shadowTest(r); };
  }, function () { modal('<h2>' + esc(r.rmName || r.rmId) + '</h2><p>The hub did not answer.</p><div class="acts"><button type="button" class="btn" onclick="modal(null)">Close</button></div>'); });
}
function shadowTest(r) {
  ask({title: 'Run for real and check?', danger: true, yes: 'Run it now',
       text: 'Rule Machine runs “' + esc(r.rmName || r.rmId) + '” once, for real: its devices will change as if it had been triggered. HAI watches and checks what its clone would have done. The test counts for the rule’s actions; its trigger still needs one real run before the light can go green.'}, function () {
    q('/migration/api/shadow', {rmId: r.rmId, op: 'test'}).then(function (out) {
      if (!out || out.ok === false) return note((out && out.message) || 'The test did not start.', true);
      var wait = Math.max(5000, Number(out.ms) || 0) + 4000;

      setTimeout(function () { load(); setTimeout(function () { var x = rowOf(r.rmId); if (x) shadowRuns(x); }, 3000); }, wait);
    }, function () { note('The hub did not answer.', true); });
  });
}

// A panel header's shortcut: the whole panel, whatever is ticked.
function bulk(op, g) {
  var m = many(op);
  if (!m) return;
  runMany(op, groupRows(visible(), g).filter(m.ok));
}
// The bar's buttons: the ticked rules this action fits.
function barRun(op) {
  var m = many(op);
  if (m) runMany(op, picked(visible()).filter(m.ok));
}
function runMany(op, rules) {
  if (!rules.length) return;
  if (op === 'tell') return tellHai(rules);
