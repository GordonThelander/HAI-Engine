<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Move rules to HAI</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1a;--dim:#6a6a63;--line:#dcdcd4;--card:#fff;--rm:#8a5a00;--hai:#1a5f3f;--warn:#9a2020;--off:#8a8a82;
  --accent:#0D6A88;--accent2:#2f8aa6;--tile:#ecf2f5;--tile2:#d7e7ee;--accent-soft:rgba(13,106,136,.09);--on-accent:#fff;
  --amber:#b4621a;--amber-soft:#fdf4e9;--amber-line:#efd2ad;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--fg:#e8e8e4;--dim:#9a9a92;--line:#33333a;--card:#1f1f24;--rm:#d9a441;--hai:#5fc79a;--warn:#e07070;--off:#6a6a72;
  --accent:#5bb8d6;--accent2:#3f8fab;--tile:#232c33;--tile2:#2e4652;--accent-soft:rgba(91,184,214,.12);--on-accent:#0b1d24;
  --amber:#e0a050;--amber-soft:rgba(224,160,80,.1);--amber-line:rgba(224,160,80,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding:20px 16px 48px}
main{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0}
a{color:var(--accent)}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.sub{color:var(--dim);font-size:13px;margin:0;max-width:62ch}
.hacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.read{color:var(--dim);font-size:12px;margin:0 0 14px}
.note{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card);margin:0 0 10px;font-size:13px}
.note.err{border-color:var(--warn);color:var(--warn)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0 0 14px}
.sec .sh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec .n{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
.sec .none{color:var(--dim);font-size:13px;margin:2px 0}
.msg{font-size:13px;margin:8px 0 0}
.msg.err{color:var(--warn)}
.batch{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.batch:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin:2px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.r{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:start;padding:5px 0}
.r input[type=checkbox]{margin:3px 0 0}
.r .nm{font-weight:600;overflow-wrap:anywhere}
.r .nm button.tg{border:0;background:none;padding:0 4px 0 0;color:var(--dim);font-size:11px;cursor:pointer}
.r .why{grid-column:2/4;color:var(--dim);font-size:12.5px}
.r .why.need{color:var(--rm)}
.r .act{white-space:nowrap}
.st{font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}
.st.ok{color:var(--hai)}.st.no{color:var(--rm)}.st.empty{color:var(--off)}.st.live{color:var(--hai)}.st.paused{color:var(--accent)}
.det{grid-column:2/4;font-size:12.5px;color:var(--fg);background:var(--bg);border-radius:6px;padding:7px 9px;margin-top:4px}
.det ul{margin:2px 0 6px;padding-left:18px}
.det .links{display:flex;flex-wrap:wrap;gap:4px 12px}
.anyway{grid-column:2/4;font-size:12.5px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.r>.st{justify-self:end;align-self:start}
@media (max-width:560px){.r .act{grid-column:2/4;justify-self:start}}
.find{margin:0 0 12px}
.find input{width:100%;max-width:360px;box-sizing:border-box;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--accent);border-radius:8px;background:var(--tile);color:var(--fg);font-weight:600;margin:0 0 12px}
.bar[hidden]{display:none}
.bar.ok{border-color:var(--hai);color:var(--hai);background:var(--card)}
.bar.err{border-color:var(--warn);color:var(--warn);background:var(--card)}
.bar .spin{width:16px;height:16px;flex:0 0 16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar .spin{animation:none;border-color:var(--accent)}}
</style>
</head>
<body>
<main>
<header class="top">
  <div><h1>Move Rule Machine rules to HAI</h1>
  <p class="sub">Optional. Rule Machine keeps running each rule until you cut it over, and you can roll back any time.</p></div>
  <div class="hacts"><button type="button" id="scanAgain">Scan again</button><button type="button" id="notNow" class="link">Not now</button></div>
</header>
<p class="read" id="read"></p>
<div class="find"><input type="search" id="find" placeholder="Search rules" aria-label="Search rules by name" autocomplete="off"></div>
<div class="bar" id="bar" role="status" aria-live="polite" hidden></div>
<div id="notes"></div>
<section class="sec" id="sAssess" aria-labelledby="hAssess"></section>
<section class="sec" id="sClone" aria-labelledby="hClone"></section>
<section class="sec" id="sCut" aria-labelledby="hCut"></section>
<section class="sec" id="sBack" aria-labelledby="hBack"></section>
</main>

<script>
var AUD = new URLSearchParams(location.search).get('aud') || '';
var TOKEN = new URLSearchParams(location.search).get('access_token') || '';
var ROWS = [];
var OPEN = {};
// Upgrades ticked per rule before Copy. Unticked means the copy behaves as Rule Machine did.
var UPG = {};
// Commands a driver renamed, as the hub suggested them when a clone was refused: rmId -> [{from, to, device}].
var RENAME = {};
// Assess now: rules ticked for it, whether this Automation Map can take a request, and the one outstanding.
var SEL = {};
var ASSESS = {available: false, why: ''};
var PENDING = null;

// One press at a time. The app is single-threaded: a press sent while another is still being worked on
// waits for the hub's gate, and back-to-back presses ran it out (120 s), so the page would not load. A press made
// while one is outstanding is refused here, at once, with nothing sent. Reads (GET) still go through.
var BUSY = false;

function q(path, body) {
  if (body && BUSY) return Promise.resolve({ok: false, code: 'MIGRATION_PAGE_BUSY', message: 'The hub is still working on the last press. Try again when it answers.'});
  if (body) BUSY = true;
  var u = new URL(location.origin + location.pathname.replace(/\/migration.*$/, '') + path);
  if (TOKEN) u.searchParams.set('access_token', TOKEN);
  if (AUD) u.searchParams.set('aud', AUD);
  var opt = body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {};
  var sent = fetch(u.toString(), opt).then(function (r) { return r.json().catch(function () { return {ok: false, message: 'The hub did not answer with a result.'}; }); });
  if (!body) return sent;
  return sent.then(function (out) { BUSY = false; return out; }, function (e) { BUSY = false; throw e; });
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]; }); }

var LIVE = {
  rm: ['rm', 'Rule Machine', 'The Rule Machine rule is the one acting on your house.'],
  hai: ['hai', 'HAI', 'The HAI copy is the one acting on your house.'],
  both: ['both', 'Both at once', 'Both rules are running, so both will act. Switch over, or pause one of them.'],
  neither: ['neither', 'Nothing running', 'Neither rule is running, so whatever this rule used to do, nothing is doing. Switch back to Rule Machine, or start the HAI copy.']
};

var LABELS = {
  clone: 'Create a disabled HAI copy',
  switchOver: 'Switch over to HAI',
  switchBack: 'Switch back to Rule Machine',
  deleteClone: 'Delete the HAI copy',
  deleteOriginal: 'Delete the Rule Machine rule'
};

var PHASE = {none: 'not started', cloned: 'copy made, not live', switched: 'switched to HAI', reverted: 'switched back'};
var HAI_STATE = {active: 'running', disabled: 'stopped', held: 'held, not on the hub', staging: 'being set up'};

// Four verdicts, and the chip class says which kind of thing it is rather than how worried to be.
// 'unassessed' deliberately shares the muted colour with 'neither': nobody looked is not a warning.
var VERDICT = {
  'ready': ['ready', 'Ready to copy'],
  'needs-decision': ['decide', 'Needs a decision'],
  'blocked': ['blocked', 'Cannot be read'],
  'empty': ['unknown', 'Empty rule'],
  'unassessed': ['unknown', 'Not assessed']
};

// The band is a word, never a number and never a percentage. The score exists to order rows and is not
// shown: a figure on a row invites being read as a confidence, which it is not.
var BAND = {simple: 'straightforward', moderate: 'some care needed', involved: 'involved', unknown: ''};

function note(text, bad) {
  var d = document.createElement('div');
  d.className = 'note' + (bad ? ' err' : '');
  d.innerHTML = text;
  document.getElementById('notes').appendChild(d);
}

// How long ago an ISO time was, in words; '' when there is no time to judge.
function ago(iso) {
  var t = Date.parse(iso || '');
  if (isNaN(t)) return '';
  var m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 60 ? m + ' minute' + (m === 1 ? '' : 's')
    : m < 2880 ? Math.round(m / 60) + ' hour' + (Math.round(m / 60) === 1 ? '' : 's')
    : Math.round(m / 1440) + ' days';
}


// ---- Conversion report ---------------------------------------------------------------------------------
// Built from the rows this page already has: the state read rebuilds every decoded rule in memory, writes
// nothing, and keeps only the verdict. No new request, so nothing more for the hub to do.
//
// Ordered for a person deciding what to move: opening on what could not be rebuilt, and repeating one
// sentence per rule, buries the answer. So it
// leads with how many rules can move today, leaves test rules out unless asked, groups what is in the way by
// what fixes it, says each repeated sentence once, and gives every rule one plain sentence and a colour.
//
// Everything from here to "report logic ends" reads only its arguments: engine/check-migration-report.js runs
// it on invented rows, the way check-editor-page.js parses the page.

// Test rules: left out of the report unless "Show test rules" is ticked, and never copied in bulk. A rule is a
// test rule when its name matches one of these, or when its rebuild says it has no actions in Rule Machine (a draft).
// One list, so a new naming habit is one line here.
var TEST_RULE_NAMES = [
  /^__/,              // probe and throwaway rules
  /^_HAI /,           // HAI's own decoder and regression rules
  /\(throwaway\)/i,
  /\(probe/i          // "(probe)" and "(probe, keep)"
];
var TEST_RULE_NO_ACTIONS = 'this rule has no actions in Rule Machine';

// How many rules one bulk Copy may name: MIG_BATCH_MAX in engine/lib/hai_migration.groovy. The app copies that
// many in one press and reports the rest as not reached, so the page offers exactly that many at a time.
var REP_BATCH_MAX = 6;

// What fixes each problem, matched on stable phrases of the reason text (a row carries the sentence, not a
// code). First match wins; a reason nothing matches needs the person. `light` is the rule's traffic light when
// this is the worst thing about it: 'wait' (amber) is HAI's side to resolve, 'you' (red) is the person's.
var REP_FIXES = [
  {key: 'fix', light: 'wait', title: 'Fix in progress, nothing for you to do',
   hint: 'A fix for these is already under way. They can move once it ships.',
   say: 'Waiting on a fix that is already under way.', act: 'Nothing to do, wait for the fix',
   // Empty while no fix is under way. Add a phrase of the reason here while one is.
   phrases: []},
  {key: 'measure', light: 'wait', title: 'Needs Rule Machine behaviour measured',
   hint: 'HAI will not guess how Rule Machine behaves here. Nothing for you to do; these can move once it is measured.',
   say: 'Waiting until HAI knows how Rule Machine handles part of it.', act: 'Nothing to do, wait for the fix',
   phrases: ['never close', 'XOR', 'stops as soon as an OR', 'not been measured', 'not measured', 'never been established']},
  {key: 'hand', light: 'you', title: 'Won\'t be copied, set up by hand',
   hint: 'HAI leaves these out on purpose. If you still want them, set them up yourself.',
   say: 'Will not be copied: set it up by hand if you still want it.', act: 'Rebuild by hand, or keep it in Rule Machine',
   phrases: ['Not copied on purpose']},
  {key: 'you', light: 'you', title: 'Needs you',
   hint: 'One change from you each, and these can move.',
   say: 'Needs a change from you before it can move.', act: 'One change each',
   phrases: []}
];
var REP_YOU = REP_FIXES[REP_FIXES.length - 1];
// The plain sentence for a 'Needs you' rule, by what is in the way. First match wins.
var REP_YOU_SAY = [
  ['not allowed to use', 'Uses a device HAI may not use yet: select it in HAI Engine\'s devices.'],
  ['disabled on this hub', 'Can be copied, but uses a disabled device: enable it before switching over.'],
  ['may not change', 'Changes a hub variable HAI rules may not change yet.'],
  ['sets the mode', 'Sets the mode, which HAI rules may not do yet.'],
  ['Copy it anyway', 'Reboots or shuts down the hub: tick "Copy it anyway" on its row if you want it copied.'],
  ['has changed since', 'Changed in Rule Machine since it was copied: copy it again.'],
  ['could not go on the hub', 'Its copy is held, not on the hub.'],
  ['last run went wrong', 'Its HAI copy\'s last run went wrong.'],
  ['no mapping for', 'Uses something HAI cannot copy yet.']
];
var REP_LIGHTS = [['ok', 'ready'], ['wait', 'after a fix'], ['you', 'need you'], ['none', 'not read yet']];

function repTestName(n) { return TEST_RULE_NAMES.some(function (p) { return p.test(n || ''); }); }
function repIsTest(r) {
  if (repTestName(r.rmName)) return true;
  var said = [(r.rebuild || {}).message, (r.conditions || {}).message].concat(r.verdictReasons || []);
  return said.some(function (s) { return s && String(s).indexOf(TEST_RULE_NO_ACTIONS) >= 0; });
}
function repFix(text) {
  for (var i = 0; i < REP_FIXES.length; i++) {
    if (REP_FIXES[i].phrases.some(function (p) { return String(text).indexOf(p) >= 0; })) return REP_FIXES[i];
  }
  return REP_YOU;
}
function repYouSay(text) {
  for (var i = 0; i < REP_YOU_SAY.length; i++) if (String(text).indexOf(REP_YOU_SAY[i][0]) >= 0) return REP_YOU_SAY[i][1];
  return null;
}

// Everything that stands between a rule and its move, each with what fixes it. Coupling ('rules') is not here:
// it decides the order rules move in, not whether one can.
function repIssues(r) {
  var out = [];
  var add = function (text, fix, w) {
    if (text && !out.some(function (x) { return x.text === String(text); })) out.push({text: String(text), fix: fix || repFix(text), w: w || null});
  };
  if (r.conditions && r.conditions.ok === false) add(r.conditions.message || 'HAI cannot rebuild its conditions.');
  else if (r.rebuild && r.rebuild.ok === false) add(r.rebuild.message || 'HAI cannot rebuild this rule.');
  (r.warnings || []).forEach(function (w) {
    if (w.kind === 'rules') return;
    // A held copy, a changed rule, a copy whose last run went wrong: each one the person's.
    add(w.message, w.blocking ? null : REP_YOU, w);
  });
  if (!out.length && (r.verdict === 'needs-decision' || r.verdict === 'blocked')) {
    add((r.verdictReasons || [])[0] || (r.verdict === 'blocked' ? 'HAI cannot read this rule.' : 'HAI needs a decision from you about this rule.'));
  }
  return out;
}

// One rule's traffic light and plain sentence: green ready, amber only HAI's side in the way, red needs you.
function repLight(r, issues) {
  if (r.unread) return {light: 'none', say: 'Not read by Automation Map yet.'};
  if (!r.verdict || r.verdict === 'unassessed') return {light: 'none', say: 'Not assessed yet.'};
  if (r.verdict === 'empty') return {light: 'wait', say: 'Empty rule: it has no actions in Rule Machine.'};
  // A disabled device does not stop a copy, only that rule's Switch over, so it does not colour the rule: counting it
  // made the headline disagree with the rows (HAI, 17 October). Its next step still says to enable the device.
  var counted = issues.filter(function (x) { return !(x.w && x.w.kind === 'disabled'); });
  var mine = counted.filter(function (x) { return x.fix.light === 'you'; });
  if (mine.length) return {light: 'you', say: (mine[0].fix === REP_YOU && repYouSay(mine[0].text)) || mine[0].fix.say};
  if (counted.length) return {light: 'wait', say: counted[0].fix.say};
  if (r.verdict !== 'ready') return {light: 'you', say: REP_YOU.say};
  if (r.phase === 'switched') return {light: 'ok', say: 'Already moved to HAI.'};
  if (r.haiId) return {light: 'ok', say: 'Copied to HAI, not switched over yet.'};
  return {light: 'ok', say: 'Ready to copy.'};
}

// The one next step for a rule, a short verb phrase that says what needs to be done.
// `by` is the rules that reach into it, if any.
function repNames(w, fallback) {
  var n = (w && w.names) || [];
  return n.length ? n.slice(0, 2).join(' and ') + (n.length > 2 ? ' and others' : '') : fallback;
}
// The specific thing a refusal names, when it is short enough to say in the step: a quoted name, or a short reason.
function repWhat(text) {
  var q = /'([^']{1,32})'/.exec(text);
  if (q) return q[1];
  var first = repSplit(text)[0].replace(/[.!?]$/, '');
  if (first.length <= 48) return first;
  var clause = first.split(/[:;,]/)[0];
  return clause.length <= 48 ? clause.replace(/^This /, 'this ') : '';
}
function repNext(r, issues, light, by) {
  if (light === 'none') return 'Assess it';
  var kind = function (k) { return issues.filter(function (x) { return x.w && x.w.kind === k; })[0]; };
  // "then copy" only when nothing else stands in the way: a rule that also needs a second change, or waits on a
  // fix, cannot be copied after the first one, so the step says what comes next instead.
  var then = function (chosen, done) {
    var rest = issues.filter(function (x) { return x !== chosen && !(x.w && x.w.blocking === false); });
    if (!rest.length) return done;
    var more = rest.filter(function (x) { return x.fix.light === 'you'; }).length;
    return more ? 'then ' + (more === 1 ? 'one more change' : more + ' more changes') + ' (see details)' : 'then wait for the fix';
  };
  if (light === 'you') {
    var dev = kind('devices'), vars = kind('variables'), mode = kind('mode');
    if (dev) return 'Select ' + repNames(dev.w, 'its device') + ' in HAI Engine, ' + then(dev, 'then copy');
    if (vars) return 'Approve ' + repNames(vars.w, 'its hub variable') + ' in HAI Engine, ' + then(vars, 'then copy');
    if (mode) return 'Allow mode changes in HAI Engine, ' + then(mode, 'then copy');
    var refusal = issues.filter(function (x) { return !x.w; })[0];
    if (refusal && refusal.fix.key === 'hand') return 'Rebuild by hand in the HAI editor, or keep it in Rule Machine';
    if (refusal && refusal.fix.light === 'you') {
      var what = repWhat(refusal.text);
      return 'Edit it in Rule Machine' + (what ? ' (' + what + ')' : '') + ', then Assess again';
    }
    if (kind('drift')) return 'Delete the copy and copy again';
    if (kind('watch')) return 'Check its last run; switch back if it repeats';
    if (kind('refused')) return 'Fix what held the copy, then switch over';
    var off = kind('disabled');
    if (off && !r.haiId && then(off, '')) return 'Enable ' + repNames(off.w, 'its device') + ' before switching over, ' + then(off, '');
    if (off) return (r.haiId ? 'Enable ' : 'Copy now; enable ') + repNames(off.w, 'its device') + ' before switching over';
    return 'Keep it in Rule Machine for now';
  }
  // A disabled device no longer colours the rule (repLight), so its step is said here too.
  var off0 = kind('disabled');
  if (light === 'wait') return off0 && !r.haiId ? 'Enable ' + repNames(off0.w, 'its device') + ' before switching over, then wait for the fix' : 'Nothing to do, wait for the fix';
  if (off0 && r.phase !== 'switched') return (r.haiId ? 'Enable ' : 'Copy now; enable ') + repNames(off0.w, 'its device') + ' before switching over';
  if (r.phase === 'switched') return 'Nothing to do, it runs on HAI';
  var options = ((r.rebuild && r.rebuild.behaviour) || []).some(function (b) { return b.differs || b.upgrade; });
  var copy = r.haiId ? '' : 'Copy';
  if (by && by.length) {
    var after = by.length <= 2 ? 'switch over after ' + by.join(' and ') + (by.length === 1 ? ' has' : ' have') + ' moved' : 'switch over last';
    return (copy ? 'Copy now, ' : '') + (copy ? after : after.charAt(0).toUpperCase() + after.slice(1));
  }
  if (options) return copy ? 'Copy, check its options, then switch over' : 'Check its options, then switch over';
  return copy ? 'Copy, then switch over' : 'Switch over';
}

function repAdd(map, key, name) { (map[key] = map[key] || []).push(name); }
// How many rules a section covers. A rule with two sentences in one section is one rule, not two.
function repRuleCount(items) {
  var seen = {};
  items.forEach(function (x) { x[1].forEach(function (n) { seen[n] = true; }); });
  return Object.keys(seen).length;
}
// [text, [rule names]], the sentence said by most rules first.
function repPairs(map) {
  return Object.keys(map).map(function (k) { return [k, map[k]]; })
    .sort(function (a, b) { return b[1].length - a[1].length || (a[0] < b[0] ? -1 : 1); });
}

function reportData(rows, showTests, ticked) {
  var tests = rows.filter(repIsTest);
  var shown = showTests ? rows : rows.filter(function (r) { return !repIsTest(r); });
  var d = {total: shown.length, tests: tests.length, showTests: !!showTests,
           lights: {ok: [], wait: [], you: [], none: []}, copied: 0, moved: 0,
           groups: {}, differs: {}, skipped: {}, reach: {}, pbOnly: {}, unread: [], ready: [], readyTicked: []};
  REP_FIXES.forEach(function (f) { d.groups[f.key] = {}; });
  shown.forEach(function (r) {

// ---- Flow logic ----------------------------------------------------------------------------------------
// The guided flow, four steps (17 October: the ten were confusing): Check, Choose, Copy, Switch over.
// Everything from here to "flow logic ends" reads only its arguments and the report logic above, so

var FLOW_STEPS = [
  {n: 1, title: 'Check', what: 'Automation Map reads every Rule Machine rule, HAI works out what each copy needs, and rules that command each other are put into rounds. All of it happens on its own.'},
  {n: 2, title: 'Choose', what: 'Tick the rules to move now, or a whole round. Anything that stops a copy shows here.'},
  {n: 3, title: 'Copy', what: 'HAI makes a stopped copy of each chosen rule. Rule Machine keeps running, so nothing changes in your house yet.'},
  {n: 4, title: 'Switch over', what: 'Rule Machine is paused, and seen to be paused, before the HAI copy goes live. Switch back is there for every rule, at any time.'}

var FLOW_LAST = FLOW_STEPS.length;
var FLOW_NEXT = {
  1: 'You choose the rules to move now.',
  2: 'HAI makes stopped copies of the rules you chose. Pressing Copy is your go-ahead.',
  3: 'You switch the copies over when you are ready. Rule Machine runs them until then.',
  4: 'Watch the rules on HAI. If one misbehaves, switch it back. Then choose the next ones.'

// Where a rule has got: none, held (a copy refused by the hub), copied, switched or reverted.

// A badge only for a copy someone said they tried for real (recorded before the test step was dropped).
function flowBadge(r, me) {

}
function flowCounts(rows) {

  rows.forEach(function (r) { c[flowStage(r)]++; });

}
// Each rule's light and next step, from the conversion report's own classification.
function flowLights(rows) {
  var d = reportData(rows, true);

// The rounds with their rows, lights and stages, and the next thing to do in each.

    var rs = rd.rmIds.map(function (id) { return byId[id]; }).filter(Boolean);
    var l = {ok: 0, wait: 0, you: 0, none: 0};
    rs.forEach(function (r) { l[(of[r.rmId] || {}).light || 'none']++; });

function flowRoundNext(rs, of, c) {

  var toCopy = rs.filter(function (r) { return flowStage(r) === 'none' && (of[r.rmId] || {}).light === 'ok'; }).length;
  var needYou = rs.filter(function (r) { return flowStage(r) === 'none' && (of[r.rmId] || {}).light === 'you'; }).length;
  var wait = rs.filter(function (r) { return flowStage(r) === 'none' && (of[r.rmId] || {}).light === 'wait'; }).length;

  var h = '<div class="sh"><h2 id="hAssess">1. Assess<span class="n">' + can + ' of ' + all.length + ' can clone</span></h2></div>';
  if (!all.length) { el.innerHTML = h + '<p class="none">Every rule has an HAI copy.</p>'; return; }
  if (!rows.length) { el.innerHTML = h + noMatch(); return; }
  h += batchesOf(rows).map(function (b) {
    var ok = b.rows.filter(cloneReady);
    var all = ok.length && ok.every(function (r) { return SEL[r.rmId]; });
    return '<div class="batch"><div class="bh">' +
      (ok.length ? '<input type="checkbox" data-batch="' + esc(b.key) + '"' + (all ? ' checked' : '') + ' aria-label="Tick all in ' + esc(b.title) + '">' : '') +
      esc(b.title) + ' <span class="n">' + b.rows.length + '</span></div>' +
      b.rows.map(function (r) {
        var s = assessStatus(r);
        var p = power(r);
        var tick = cloneReady(r) ? '<input type="checkbox" data-sel="' + esc(r.rmId) + '"' + (SEL[r.rmId] ? ' checked' : '') + ' aria-label="Tick ' + esc(r.rmName) + '">' : '<span></span>';
        return '<div class="r">' + tick + nameCell(r) + '<span class="st ' + s.cls + '">' + s.word + '</span>' +
          (s.why ? '<span class="why">' + esc(s.why) + '</span>' : '') +
          (p && canClone(r) ? '<label class="anyway"><input type="checkbox" data-anyway="' + esc(r.rmId) + '"' + ((UPG[r.rmId] || {}).hubPower ? ' checked' : '') + '> ' +
            'Clone it anyway: this rule ' + (/shut/.test(p.message || '') ? 'shuts down' : 'reboots') + ' the hub, and the copy will too</label>' : '') +
          detail(r) + '</div>';
      }).join('') + '</div>';
  }).join('');
  el.innerHTML = h;
}

function renderClone(rows) {
  var el = document.getElementById('sClone');
  var ticked = rows.filter(function (r) { return SEL[r.rmId] && cloneReady(r); });
  el.innerHTML = '<div class="sh"><h2 id="hClone">2. Clone</h2></div>' +
    '<div class="foot"><button type="button" class="primary" id="cloneGo"' + (ticked.length && !WORKING ? '' : ' disabled') + '>Clone ' + ticked.length + '</button>' +
    '<span class="sub">' + (ticked.length ? 'The copies land paused. Rule Machine keeps running.' : 'Tick rules in Assess to clone them.') + '</span></div>' +
    msgHtml('clone');
}

function renderCut(all) {
  var el = document.getElementById('sCut');
  var n = all.filter(function (r) { return !cutStatus(r) && CUT[r.rmId]; }).length;
  var rows = all.filter(shown);
  var ok = rows.filter(function (r) { return !cutStatus(r); });
  var h = '<div class="sh"><h2 id="hCut">3. Cut over<span class="n">' + plural(all.length, 'copy', 'copies') + ' paused on HAI</span></h2>' +
    (all.length ? '<button type="button" id="cutDel"' + (n && !WORKING ? '' : ' disabled') + '>Delete ' + n + '</button> ' +
                  '<button type="button" class="primary" id="cutGo"' + (n && !WORKING ? '' : ' disabled') + '>Cut over ' + n + '</button>' : '') + '</div>';
  if (!all.length) { el.innerHTML = h + '<p class="none">Nothing cloned yet.</p>' + msgHtml('cut'); return; }
  if (!rows.length) { el.innerHTML = h + noMatch() + msgHtml('cut'); return; }
  var allOn = ok.length && ok.every(function (r) { return CUT[r.rmId]; });
  h += (ok.length > 1 ? '<div class="bh"><input type="checkbox" id="cutAll"' + (allOn ? ' checked' : '') + ' aria-label="Tick every copy shown"> Every copy' + (FIND ? ' shown' : '') + '</div>' : '') +
    rows.map(function (r) {
      var why = cutStatus(r);
      var tick = why ? '<span></span>' : '<input type="checkbox" data-cut="' + esc(r.rmId) + '"' + (CUT[r.rmId] ? ' checked' : '') + ' aria-label="Tick ' + esc(r.rmName) + '">';
      return '<div class="r">' + tick + nameCell(r) + '<span class="st paused">Paused on HAI</span>' +
        (why ? '<span class="why need">' + esc(why) + '</span>' : '') + detail(r) + '</div>';
    }).join('');
  el.innerHTML = h + msgHtml('cut');
}

function renderBack(all) {
  var el = document.getElementById('sBack');
  var rows = all.filter(shown);
  var h = '<div class="sh"><h2 id="hBack">4. Rollback<span class="n">' + plural(all.length, 'rule', 'rules') + ' live on HAI</span></h2></div>';
  if (!all.length) { el.innerHTML = h + '<p class="none">No rule is live on HAI yet.</p>' + msgHtml('back'); return; }
  if (!rows.length) { el.innerHTML = h + noMatch() + msgHtml('back'); return; }
  h += batchesOf(rows).map(function (b) {
    return '<div class="batch"><div class="bh">' + esc(b.title) +
      (b.rows.length > 1 ? ' <button type="button" class="link" data-backbatch="' + esc(b.key) + '">Roll back all ' + b.rows.length + '</button>' : '') + '</div>' +
      b.rows.map(function (r) {
        var can = r.ops && r.ops.switchBack && r.ops.switchBack.available;
        return '<div class="r"><span></span>' + nameCell(r) + '<span class="act"><span class="st live">Live on HAI</span> ' +
          '<button type="button" data-back="' + esc(r.rmId) + '"' + (can && !WORKING ? '' : ' disabled') + '>Roll back</button></span>' +
          (can ? '' : '<span class="why need">' + esc(first(r.ops && r.ops.switchBack && r.ops.switchBack.why)) + '</span>') + detail(r) + '</div>';
      }).join('') + '</div>';
  }).join('');
  el.innerHTML = h + msgHtml('back');
}

function render() {
  var assessRows = ROWS.filter(function (r) { return !hasCopy(r); });
  var cutRows = ROWS.filter(function (r) { return hasCopy(r) && !isLive(r); });
  var liveRows = ROWS.filter(isLive);
  // Ticks only for rules still in the section they were ticked in.
  Object.keys(SEL).forEach(function (k) { if (!assessRows.some(function (r) { return r.rmId === k && cloneReady(r); })) delete SEL[k]; });
  Object.keys(CUT).forEach(function (k) { if (!cutRows.some(function (r) { return r.rmId === k && !cutStatus(r); })) delete CUT[k]; });
  renderAssess(assessRows);
  renderClone(assessRows);
  renderCut(cutRows);
  renderBack(liveRows);
  wire();
}

function wire() {
  var all = function (sel, f) { Array.prototype.forEach.call(document.querySelectorAll(sel), f); };
  all('[data-det]', function (b) { b.onclick = function () { var k = b.getAttribute('data-det'); DET[k] = !DET[k]; render(); }; });
  all('[data-sel]', function (b) { b.onchange = function () { var k = b.getAttribute('data-sel'); if (b.checked) SEL[k] = true; else delete SEL[k]; render(); }; });
  all('[data-batch]', function (b) {
    b.onchange = function () {
      var key = b.getAttribute('data-batch');
      ROWS.forEach(function (r) { if (!hasCopy(r) && shown(r) && (r.round ? String(r.round) : 'other') === key && cloneReady(r)) { if (b.checked) SEL[r.rmId] = true; else delete SEL[r.rmId]; } });
      render();
    };
  });
  all('[data-anyway]', function (b) {
    b.onchange = function () { var k = b.getAttribute('data-anyway'); UPG[k] = UPG[k] || {}; UPG[k].hubPower = b.checked; if (!b.checked) delete SEL[k]; render(); };
  });
  all('[data-upg]', function (b) {
    b.onchange = function () { var k = b.getAttribute('data-upg'); UPG[k] = UPG[k] || {}; UPG[k][b.getAttribute('data-key')] = b.checked; };
  });
  all('[data-cut]', function (b) { b.onchange = function () { var k = b.getAttribute('data-cut'); if (b.checked) CUT[k] = true; else delete CUT[k]; render(); }; });
  var cutAll = document.getElementById('cutAll');
  if (cutAll) cutAll.onchange = function () {
    ROWS.forEach(function (r) { if (hasCopy(r) && !isLive(r) && !cutStatus(r) && shown(r)) { if (cutAll.checked) CUT[r.rmId] = true; else delete CUT[r.rmId]; } });
    render();
  };
  var cg = document.getElementById('cloneGo');
  if (cg) cg.onclick = function () { runAll('clone', ROWS.filter(function (r) { return SEL[r.rmId] && cloneReady(r); }), 'clone'); };
  var cu = document.getElementById('cutGo');
  if (cu) cu.onclick = function () { runAll('switchOver', ROWS.filter(function (r) { return CUT[r.rmId]; }), 'cut'); };
  // Bulk delete of the ticked copies (17 October). The Rule Machine rules are not touched.
  var cd = document.getElementById('cutDel');
  if (cd) cd.onclick = function () {
    var picked = ROWS.filter(function (r) { return CUT[r.rmId]; });
    if (picked.length && window.confirm('Delete ' + plural(picked.length, 'HAI copy', 'HAI copies') + '? The Rule Machine rules are not changed.')) {
      runAll('deleteClone', picked, 'cut');
      picked.forEach(function (r) { delete CUT[r.rmId]; });
    }
  };
  all('[data-back]', function (b) { b.onclick = function () { var k = b.getAttribute('data-back'); runAll('switchBack', ROWS.filter(function (r) { return r.rmId === k; }), 'back'); }; });
  all('[data-backbatch]', function (b) {
    b.onclick = function () {
      var key = b.getAttribute('data-backbatch');
      runAll('switchBack', ROWS.filter(function (r) { return isLive(r) && shown(r) && (r.round ? String(r.round) : 'other') === key; }), 'back');
    };
  });
  all('[data-del]', function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-del');
      var r = ROWS.filter(function (x) { return x.rmId === k; })[0];
      if (r && window.confirm('Delete the HAI copy of ' + (r.rmName || 'this rule') + '? The Rule Machine rule is not changed.')) runAll('deleteClone', [r], 'cut');
    };
  });
}

// Every press goes through the existing apply route: a rule with an option ticked on its own (the app takes options
// on a single copy only), the rest in batches the app's cap allows, one after another (the app is single-threaded).
var WORDS = {clone: ['cloned', 'paused on HAI'], switchOver: ['cut over', 'live on HAI'], switchBack: ['rolled back', 'back on Rule Machine'], deleteClone: ['deleted', '']};
function runAll(op, rules, where) {
  if (!rules.length || WORKING) return;
  var queue = [];
  var plain = [];
  rules.forEach(function (r) {
    var up = op === 'clone' ? upgList(r) : [];
    if (up.length) queue.push({rmId: r.rmId, op: op, upgrades: up}); else plain.push(r.rmId);
  });
  for (var i = 0; i < plain.length; i += REP_BATCH_MAX) {
    var ids = plain.slice(i, i + REP_BATCH_MAX);
    queue.push(ids.length === 1 ? {rmId: ids[0], op: op} : {op: op, rmIds: ids});
  }
  var done = 0;
  var failed = [];
  var started = Date.now();
  var flagged = [];
  var names = {};
  rules.forEach(function (r) { names[r.rmId] = r.rmName; });
  WORKING = true;
  delete MSG[where];
  var who = rules.length === 1 ? esc(rules[0].rmName || 'this rule') : plural(rules.length, 'rules', 'rules');
  var DOING = {clone: 'Cloning ', switchOver: 'Cutting over ', switchBack: 'Rolling back ', deleteClone: 'Deleting the HAI copy of '};
  bar('work', (DOING[op] || 'Working on ') + who + '…');
  render();
  var next = function () {
    if (!queue.length) {
      WORKING = false;
      var w = WORDS[op];
      // Grouped by reason, a few names each: one line per reason, not one per rule (17 October: a wall of red
      // repeating the same reason for 76 rules).
      var groups = {};
      var order = [];
      failed.forEach(function (f) {
        f.why = String(f.why).replace(/[.!?]+$/, '');
        if (!groups[f.why]) { groups[f.why] = []; order.push(f.why); }
        groups[f.why].push(f.name);
      });
      var notDone = order.map(function (why) {
        var n = groups[why];
        return esc(why) + ': ' + n.slice(0, 5).map(function (x) { return esc(x); }).join(', ') + (n.length > 5 ? ' and ' + (n.length - 5) + ' more' : '');
      });
      var said = (done ? (done === 1 && rules.length === 1 ? esc(rules[0].rmName || 'The rule') : plural(done, 'rule', 'rules')) + ' ' + w[0] + '.' + (w[1] ? ' Now ' + w[1] + '.' : '') : '') +
        (flagged.length ? ' ' + plural(flagged.length, 'rule was', 'rules were') + ' cloned as drafts to check, marked Needs fixing in the editor: ' +
          flagged.slice(0, 5).map(function (x) { return esc(x); }).join(', ') + (flagged.length > 5 ? ' and ' + (flagged.length - 5) + ' more' : '') + '.' : '') +
        (failed.length ? ' ' + failed.length + ' not done. ' + notDone.join('. ') + '.' : '');
      bar(failed.length ? 'err' : 'ok', said.trim() || 'Nothing was done.');
      if (op === 'clone') rules.forEach(function (r) { delete SEL[r.rmId]; });
      if (op === 'switchOver') rules.forEach(function (r) { delete CUT[r.rmId]; });
      load();
      return;
    }
    var body = queue.shift();
    // Done and not done counted apart, with what is left: "72 of 132 done" once counted refusals as done.
    // Time left from this run's own pace, so a person knows how long N rules take on their hub.
    var left = rules.length - done - failed.length - flagged.length;
    var spent = (Date.now() - started) / 1000;
    var each = rules.length - left ? spent / (rules.length - left) : 0;
    var eta = each ? ' About ' + (left * each < 90 ? Math.max(1, Math.round(left * each)) + ' seconds' : Math.round(left * each / 60) + ' minutes') + ' left.' : '';
    if (rules.length > 1) bar('work', (DOING[op] || 'Working on ') + who + '… ' + done + ' done, ' + (flagged.length ? flagged.length + ' to check, ' : '') + failed.length + ' not done, ' +
      left + ' to go.' + eta);
    q('/migration/api/apply', body).then(function (out) {
      if (out && out.done instanceof Array) {
        done += out.done.length;
        (out.failed || []).forEach(function (f) { if (f.renames && f.renames.length) { RENAME[f.rmId] = f.renames; DET[f.rmId] = true; } });
        (out.failed || []).concat(out.notAttempted || []).forEach(function (f) {
          if (f.flagged) flagged.push(f.rmName || names[f.rmId] || f.rmId);
          else failed.push({name: f.rmName || names[f.rmId] || f.rmId, why: first(f.message || 'no reason given')});
        });
      } else if (out && out.ok === true) {
        done += 1;
      } else {
        if (out && out.renames && out.renames.length && body.rmId) { RENAME[body.rmId] = out.renames; DET[body.rmId] = true; }
        if (out && out.flagged) flagged.push(names[body.rmId] || body.rmId);
        else (body.rmIds || [body.rmId]).forEach(function (k) { failed.push({name: names[k] || k, why: first((out && out.message) || 'The hub did not say why.')}); });
      }
      next();
    }).catch(function (e) {
      (body.rmIds || [body.rmId]).forEach(function (k) { failed.push({name: names[k] || k, why: first(e.message || 'The hub did not answer.')}); });
      next();
    });
  };
  next();
}

function load() {
  document.getElementById('notes').innerHTML = '';
  var slow = null;
  if (FIRST) {
    bar('work', 'Reading your rules from Automation Map…');
    slow = setTimeout(function () { if (FIRST) bar('work', 'Still reading your rules. Large hubs can take up to a minute.'); }, 20000);
  }
  q('/migration/api/state').then(function (out) {
    clearTimeout(slow);
    if (!out || out.ok !== true) {
      bar('err', 'Your rules could not be read. ' + esc((out && out.message) || 'The hub did not say why.'));
      return;
    }
    if (FIRST) { FIRST = false; bar(null); }
    show(out);
  }).catch(function (e) { clearTimeout(slow); bar('err', 'Your rules could not be read. ' + esc(e.message || 'The hub did not answer.')); });
}

// Before the first answer: the four sections with their titles, so the page has its shape and does not look hung.
function skeleton() {
  [['sAssess', 'hAssess', '1. Assess'], ['sClone', 'hClone', '2. Clone'], ['sCut', 'hCut', '3. Cut over'], ['sBack', 'hBack', '4. Rollback']].forEach(function (x) {
    document.getElementById(x[0]).innerHTML = '<div class="sh"><h2 id="' + x[1] + '">' + x[2] + '</h2></div><p class="none">Loading…</p>';
  });
}

// One short line for what was read; the provider's own note only when it says something is wrong.
function readLine(out) {
  var p = out.provider || {};
  var age = ago(p.generatedAt);
  var bits = [];
  if (age) bits.push('Rules read ' + age + ' ago');
  var v = /Automation Map (\d+\.\d+\.\d+)/.exec((out.notes || []).join(' '));
  if (v) bits.push('by Automation Map ' + v[1]);
  document.getElementById('read').textContent = bits.length ? bits.join(' ') + '.' : '';
  var loud = {absent: 1, incompatible: 1, broken: 1, stale: 1};
  if (loud[p.state] && (out.notes || [])[0]) note(esc(out.notes[0]), true);
}

function show(out) {
  ROWS = out.rows || [];
  if (out.plan) PLAN = out.plan;
  if (out.links) LINKS = out.links;
  if (out.provider) PROVIDER = out.provider;
  ASSESS = out.assess || {available: false, why: 'Needs Automation Map 2.4.36 or later.'};
  if (!PENDING && ASSESS.request) watch(ASSESS.request);
  readLine(out);
  render();
}

// ---- Scan again ------------------------------------------------------------------------------------------
// One POST: the Migration app asks Automation Map to scan. Then this page reads the app's small answer record
// every 3 seconds, and only while a request is outstanding.
function scanMsg(t) { var b = document.getElementById('scanAgain'); b.textContent = t || 'Scan again'; b.disabled = !!t; }

function assess() {
  if (PENDING) return;
  if (!ASSESS.available) { note(esc(ASSESS.why || 'Automation Map cannot scan for HAI yet.'), true); return; }
  scanMsg('Scanning…');
  q('/migration/api/assess', {all: true}).then(function (out) {
    if (out && out.assess) { watch(out.assess); return; }
    scanMsg('');
    note('<b>The scan did not start.</b> ' + esc((out && out.message) || 'The hub did not say why.'), true);
  }).catch(function (e) { scanMsg(''); note('<b>The scan could not be sent.</b> ' + esc(e.message), true); });
}

function watch(a) {
  a.seenAt = Date.now();
  PENDING = a;
  scanMsg('Scanning…');
  setTimeout(poll, 3000);
}

function poll() {
  if (!PENDING) return;
  q('/migration/api/assess').then(function (out) {
    var a = out && out.assess;
    if (!a || a.requestId !== PENDING.requestId) { PENDING = null; scanMsg(''); return; }
    if (a.done) {
      PENDING = null;
      scanMsg('');
      if (a.done.ok !== true) note('<b>The scan did not finish.</b> ' + esc(a.done.message || a.done.reason || 'Automation Map did not say why.'), true);
      load();
      return;
    }
    a.seenAt = PENDING.seenAt;
    PENDING = a;
    var wait = a.waitMs || 300000;
    if (Date.now() - PENDING.seenAt > wait) {
      PENDING = null;
      scanMsg('');
      note('<b>Automation Map did not answer within ' + Math.round(wait / 60000) + ' minutes.</b> Open Automation Map once, then try again.', true);
      return;
    }
    setTimeout(poll, 3000);
  }).catch(function () { setTimeout(poll, 3000); });
}

document.getElementById('scanAgain').onclick = assess;
document.getElementById('find').oninput = function () { FIND = this.value.trim().toLowerCase(); if (!FIRST) render(); };
// Migration is optional: this just leaves the page. A tab the page did not open cannot close itself, so it goes
// back, or to the hub's apps.
document.getElementById('notNow').onclick = function () {
  try { window.close(); } catch (e) { /* not ours to close */ }
  setTimeout(function () { if (history.length > 1) history.back(); else location.href = '/installedapp/list'; }, 150);
};
skeleton();
load();
</script>
</body>
</html>
